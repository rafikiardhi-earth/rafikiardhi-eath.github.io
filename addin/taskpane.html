<style>
.hmc {
  --bg: #161412; --surface: #1f1c19; --surface-2: #2a2622; --ink: #f0ece4; --ink-2: #c4bdb1; --ink-3: #8f887d;
  --line: #3a352f; --accent: #d98b56; --accent-ink: #1a1410; --accent-soft: #3a2a1f; --warn: #e0a440; --good: #5cc28f; --bad: #e07070;
  color: var(--ink); font-size: 1.02rem; line-height: 1.5; max-width: 620px; margin: 8px auto 28px;
}
body.quarto-light .hmc {
  --bg: #f7f5f0; --surface: #fffdf9; --surface-2: #efebe2; --ink: #1f1c17; --ink-2: #57514a; --ink-3: #8a8379;
  --line: #ddd6ca; --accent: #8a4b22; --accent-ink: #ffffff; --accent-soft: #f3e6da; --warn: #9a6400; --good: #1f7a4d; --bad: #b3261e;
}
.hmc * { box-sizing: border-box; }
.hmc .cx { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-top: 12px; }
.hmc .step { font-size: .78rem; color: var(--ink-3); text-transform: uppercase; letter-spacing: .1em; font-weight: 600; margin: 0 0 6px; }
.hmc .hint { font-size: .9rem; color: var(--ink-2); margin: 6px 0 0; }
.hmc .fg { display: grid; grid-template-columns: repeat(6, 1fr); column-gap: 10px; }
.hmc .fg > div { grid-column: span 6; }
.hmc label { display: block; font-size: .9rem; font-weight: 600; color: var(--ink-2); margin: 10px 0 4px; }
.hmc textarea { width: 100%; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); font: .88rem ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; padding: 8px 12px; resize: vertical; display: block; }
.hmc input:focus, .hmc select:focus, .hmc textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.hmc .seg { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
.hmc .seg button { flex: 1 1 auto; min-height: 38px; border: 1px solid var(--line); background: transparent; color: var(--ink); border-radius: 999px; padding: 4px 12px; font: inherit; font-weight: 600; cursor: pointer; }
.hmc .seg button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.hmc .res { border: 2px solid var(--accent); overflow-x: auto; margin-top: 12px; }
.hmc .note { border-left: 3px solid var(--warn); background: color-mix(in srgb, var(--warn) 10%, transparent); padding: 8px 12px; border-radius: 0 10px 10px 0; font-size: .9rem; color: var(--ink-2); margin-top: 10px; }
.hmc .note.good { border-left-color: var(--good); background: color-mix(in srgb, var(--good) 10%, transparent); }
.hmc .note.bad { border-left-color: var(--bad); background: color-mix(in srgb, var(--bad) 10%, transparent); }
.hmc .tag { display: inline-block; font-size: .75rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; border-radius: 999px; padding: 1px 9px; border: 1px solid currentColor; }
.hmc .tag.good { color: var(--good); } .hmc .tag.warn { color: var(--warn); } .hmc .tag.bad { color: var(--bad); }

.hmc table.tt { width: 100%; border-collapse: collapse; font-size: .93rem; margin-top: 8px; table-layout: fixed; }
.hmc table.tt th, .hmc table.tt td { text-align: left; padding: 7px 6px; border-top: 1px solid var(--line); vertical-align: top; word-break: break-word; overflow-wrap: break-word; }
.hmc table.tt th { color: var(--ink-3); font-weight: 600; font-size: .8rem; text-transform: uppercase; letter-spacing: .05em; border-top: none; }
.hmc table.tt td:nth-child(1) { width: 10%; }
.hmc table.tt td:nth-child(2) { width: 65%; overflow-x: auto; }
.hmc table.tt td:nth-child(3) { width: 25%; }

.hmc details.cx { padding: 0; }
.hmc details summary { cursor: pointer; padding: 14px 16px; font-weight: 600; color: var(--accent); list-style: none; }
.hmc details summary::-webkit-details-marker { display: none; }
.hmc details summary::before { content: "＋ "; }
.hmc details[open] summary::before { content: "－ "; }
.hmc details .db { padding: 0 16px 16px; }
.hmc ol.work { font-size: .92rem; color: var(--ink-2); margin: 0; padding-left: 18px; }
.hmc ol.work li { margin-bottom: 6px; font-variant-numeric: tabular-nums; }

body { margin: 0; padding: 10px 12px 24px; font-family: "Segoe UI", system-ui, sans-serif; }

body.quarto-light .ra-foot a { color: #8a4b22; }

<script>
// ATTACHED DIRECTLY TO WINDOW: Guarantees global availability for Office JS listeners
window.ommlToLinear = function(element) {
  if (!element) return "";
  let result = "";

  for (let child of element.childNodes) {
    const name = child.nodeName;

    if (name === "m:matrix") {
      const mrNodes = child.getElementsByTagName("m:mr");
      let rows = [];
      for (let mr of mrNodes) {
        let cols = [];
        for (let eNode of mr.childNodes) {
          if (eNode.nodeName === "m:e") {
            cols.push(window.ommlToLinear(eNode).trim());
          }
        }
        if (cols.length > 0) rows.push(cols.join(", "));
      }
      result += " [" + rows.join("; ") + "] ";
    }
    else if (name === "m:f") { 
      const num = window.ommlToLinear(child.getElementsByTagName("m:num")[0]);
      const den = window.ommlToLinear(child.getElementsByTagName("m:den")[0]);
      result += "((" + num + ")/(" + den + "))";
    } 
    else if (name === "m:sSub") { 
      const e = window.ommlToLinear(child.getElementsByTagName("m:e")[0]);
      const sub = window.ommlToLinear(child.getElementsByTagName("m:sub")[0]);
      result += e + "_" + sub;
    } 
    else if (name === "m:sSup") { 
      const e = window.ommlToLinear(child.getElementsByTagName("m:e")[0]);
      const sup = window.ommlToLinear(child.getElementsByTagName("m:sup")[0]);
      result += e + "^(" + sup + ")";
    } 
    else if (name === "m:rad") {
      const e = window.ommlToLinear(child.getElementsByTagName("m:e")[0]);
      const degNode = child.getElementsByTagName("m:deg")[0];
      const deg = degNode ? window.ommlToLinear(degNode) : "";
      result += deg ? "nthRoot(" + e + ", " + deg + ")" : "sqrt(" + e + ")";
    }
    else if (name === "m:d") {
      const eNode = child.getElementsByTagName("m:e")[0];
      result += window.ommlToLinear(eNode);
    }
    else if (name === "m:t" || child.nodeType === 3) { 
      result += child.textContent;
    } 
    else {
      result += window.ommlToLinear(child);
    }
  }

  return result;
};

  const I18N = {

      btnSel: 'Check the selected equations',
      btnDoc: 'Find all equations in the document',

      lblVals: 'Worked example from the paper (optional): known values, e.g. q = 0.5, dz = 10, dh = -2 (lists and matrices as x = [1, 2, 3], A = [2, -1; -1, 2]):',
      lblSign: 'Variables are',
      optPos: 'Positive', optAny: 'Any sign',
      work: 'Show the working',
      tblNum: '#', tblParsed: 'Read as / Status', tblStatus: 'Status',
      lhsParsed: 'Left side parsed as:',
      rhsParsed: 'Right side parsed as:',

    },
    sw: {
      title: 'Uhakiki wa Milinganyo',

      btnSel: 'Kagua milinganyo iliyochaguliwa',
      btnDoc: 'Tafuta milinganyo yote kwenye waraka',
      btnCom: 'Weka matokeo kama maoni (comment)',
      lblEqs: 'Milinganyo, mmoja kwa kila mstari (namba kama "(3)" zinasahauliwa):',
      lblVals: 'Mfano halisi kutoka kwa jarida (sio lazima): mfano q = 0.5, dz = 10, dh = -2 (matingo na tumbo kama x = [1, 2, 3], A = [2, -1; -1, 2]):',
      lblSign: 'Alama za vibadilika (variables):',
      optPos: 'Chanya', optAny: 'Alama yoyote',
      work: 'Onyesha hesabu',
      tblNum: '#', tblParsed: 'Inasomeka kama / Hali', tblStatus: 'Hali',
      lhsParsed: 'Upande wa kushoto uliandikwa kama:',
      rhsParsed: 'Upande wa kulia uliandikwa kama:',
      rearr: 'Mabadiliko ya Milinganyo',
      workedEx: 'Mfano Uliokokotolewa'
    },
    es: {
      title: 'Comprobación de ecuaciones',
      sub: 'Sin IA. Se ejecuta en este panel; nada sale de su navegador.',
      btnSel: 'Revisar las ecuaciones seleccionadas',
      btnDoc: 'Buscar todas las ecuaciones en el documento',
      btnCom: 'Agregar hallazgos como comentario',
      lblEqs: 'Ecuaciones, una por línea (los números como "(3)" se ignoran):',
      lblVals: 'Ejemplo del artículo (opcional): valores conocidos, ej. q = 0.5, dz = 10, dh = -2 (listas y matrices como x = [1, 2, 3], A = [2, -1; -1, 2]):',
      lblSign: 'Las variables son:',
      optPos: 'Positivas', optAny: 'Cualquier signo',
      work: 'Ver el cálculo',
      tblNum: '#', tblParsed: 'Interpretado como / Estado', tblStatus: 'Estado',
      lhsParsed: 'Lado izquierdo interpretado como:',
      rhsParsed: 'Lado derecho interpretado como:',
      rearr: 'Reordenamientos',
      workedEx: 'Ejemplo resuelto'
    }
  };

  const fmt = (x, d = 2) => (x == null || !isFinite(x)) ? '–' : x.toLocaleString('en-US', { maximumFractionDigits: d, minimumFractionDigits: 0 });
  const fix = (x, d = 2) => (x == null || !isFinite(x)) ? '–' : x.toLocaleString('en-US', { maximumFractionDigits: d, minimumFractionDigits: d });
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  function updateUiLanguage(newLang) {
    lang = newLang;
    localStorage.setItem('ra-lang', lang);
    const t = I18N[lang];
    document.getElementById('lbl-title').textContent = t.title;
    document.getElementById('lbl-sub').textContent = t.sub;
    document.getElementById('ra-sel').textContent = t.btnSel;
    document.getElementById('ra-doc').textContent = t.btnDoc;
    document.getElementById('ra-com').textContent = t.btnCom;
  }

  function tool(cfg) {
    const root = document.getElementById(cfg.id);
    if (!root) return;
    let f = {};
    const inputs = cfg.inputs;

    function read() {
      const v = {};
      inputs.forEach(i => { if (!i.k) return; v[i.k] = f[i.k] !== undefined ? f[i.k] : null; });
      return v;
    }

    function fieldHTML(i) {
      const t = I18N[lang];
      const id = cfg.id + '-' + i.k;
      if (i.t === 'textarea') {
        const label = i.k === 'eqs' ? t.lblEqs : t.lblVals;
        return '<div><label for="' + id + '">' + label + '</label><textarea id="' + id + '" data-k="' + i.k + '" rows="' + (i.rows || 5) + '" placeholder="' + esc(i.ph || '') + '">' + esc(f[i.k] || '') + '</textarea></div>';
      }
      if (i.t === 'seg') {
        const cur = String(f[i.k] || i.d);
        const opts = [[ 'pos', t.optPos ], [ 'any', t.optAny ]];
        return '<div><label>' + t.lblSign + '</label><div class="seg">' + opts.map(o => '<button type="button" data-seg="' + i.k + '" data-v="' + esc(o[0]) + '" aria-pressed="' + String(o[0] === cur) + '">' + esc(o[1]) + '</button>').join('') + '</div></div>';
      }
      return '<div><label for="' + id + '">' + i.l + '</label><input type="text" id="' + id + '" data-k="' + i.k + '" value="' + esc(f[i.k] || '') + '"></div>';
    }

    function render() {
      const t = I18N[lang];
      let h = '<div class="seg" style="margin-bottom:10px" role="group">' +
        '<button type="button" data-lang="en" aria-pressed="' + String(lang === 'en') + '">English</button>' +
        '<button type="button" data-lang="sw" aria-pressed="' + String(lang === 'sw') + '">Kiswahili</button>' +
        '<button type="button" data-lang="es" aria-pressed="' + String(lang === 'es') + '">Español</button>' +
      '</div><section class="cx"><div class="fg">';
      
      inputs.forEach(i => { h += fieldHTML(i); });
      h += '</div></section><section class="cx res"></section><details class="cx hm-work"><summary>' + t.work + '</summary><div class="db"></div></details>';
      root.innerHTML = h;
      updateUiLanguage(lang);
      run();
    }

    const U = {
      fmt, fix, esc, get lang() { return lang; }, get i18n() { return I18N[lang]; },
      empty: t => '<p class="empty">' + t + '</p>',
      note: (h, cls) => '<div class="note' + (cls ? ' ' + cls : '') + '">' + h + '</div>'
    };

    function run() {
      const v = read();
      let out;
      try { out = cfg.compute(v, U) || {}; } catch (e) { out = { html: U.empty("Error running calculation") }; console.warn(e); }
      root.querySelector('.res').innerHTML = out.html || '';
      const wd = root.querySelector('.hm-work');
      wd.hidden = !out.work || !out.work.length;
      wd.querySelector('.db').innerHTML = out.work && out.work.length ? '<ol class="work">' + out.work.map(w => '<li>' + w + '</li>').join('') + '</ol>' : '';
      
      if (window.MathJax && MathJax.typesetPromise) {
        MathJax.typesetPromise([root.querySelector('.res')]).catch(err => console.log(err));
      }
    }

    root.addEventListener('input', e => {
      const ta = e.target.closest('textarea[data-k]');
      if (ta) { f[ta.dataset.k] = ta.value; run(); }
    });
    root.addEventListener('click', e => {
      const b = e.target.closest('button');
      if (!b) return;
      if (b.dataset.lang) {
        updateUiLanguage(b.dataset.lang);
        render();
        return;
      }
      if (b.dataset.seg) {
        f[b.dataset.seg] = b.dataset.v;
        b.parentElement.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
        run();
      }
    });

    render();
    return { set: (k, val) => { f[k] = val; const ta = root.querySelector('textarea[data-k="' + k + '"]'); if (ta) ta.value = val; run(); } };
  }

  return { tool, fmt, fix, esc };
})();

(function () {
  const GREEK = { alpha: 'α', beta: 'β', gamma: 'γ', delta: 'δ', epsilon: 'ε', varepsilon: 'ε', zeta: 'ζ', eta: 'η', theta: 'θ', vartheta: 'θ', kappa: 'κ', lambda: 'λ', mu: 'μ', nu: 'ν', xi: 'ξ', rho: 'ρ', varrho: 'ρ', sigma: 'σ', tau: 'τ', phi: 'φ', varphi: 'φ', chi: 'χ', psi: 'ψ', omega: 'ω', Delta: 'Δ', Gamma: 'Γ', Theta: 'Θ', Lambda: 'Λ', Sigma: 'Σ', Phi: 'Φ', Psi: 'Ψ', Omega: 'Ω', Xi: 'Ξ', Pi: 'Π', Upsilon: 'Υ', upsilon: 'υ', iota: 'ι' };
  const OPS = ['integ', 'indef', 'sumn', 'prodn'];
  const FUN = ['sqrt', 'exp', 'log', 'log10', 'sin', 'cos', 'tan', 'asin', 'acos', 'atan', 'sinh', 'cosh', 'tanh', 'abs', 'nthRoot', 'erf', 'pi', 'max', 'min', 'det', 'inv', 'transpose', 'Infinity'].concat(OPS);
  const SUP = { '⁰': '0', '¹': '1', '²': '2', '³': '3', '⁴': '4', '⁵': '5', '⁶': '6', '⁷': '7', '⁸': '8', '⁹': '9', '⁻': '-', '⁺': '+', '⁽': '(', '⁾': ')', 'ⁿ': 'n' };
  const SUB = { '₀': '0', '₁': '1', '₂': '2', '₃': '3', '₄': '4', '₅': '5', '₆': '6', '₇': '7', '₈': '8', '₉': '9', 'ₐ': 'a', 'ₑ': 'e', 'ᵢ': 'i', 'ⱼ': 'j', 'ₖ': 'k', 'ₗ': 'l', 'ₘ': 'm', 'ₙ': 'n', 'ₒ': 'o', 'ₚ': 'p', 'ᵣ': 'r', 'ₛ': 's', 'ₜ': 't', 'ᵤ': 'u', 'ᵥ': 'v', 'ₓ': 'x' };
  const NAME = '[A-Za-z\\u0370-\\u03FF][A-Za-z0-9_\\u0370-\\u03FF]*';
  const UNSUPPORTED = /[∬∭∮∯]|\\(iint|iiint|oint|lim)(?![A-Za-z])|\blim\b/;
  const STAR = '(\\*|\\\\ast|\\\\star)', PRIME = '(\\\\prime)';
  const OPEN = { '{': '}', '(': ')', '[': ']' };

  function close(s, i) { const o = s[i], c = OPEN[o]; let d = 0; for (let j = i; j < s.length; j++) { if (s[j] === o) d++; else if (s[j] === c && !--d) return j; } return s.length; }
  function bound(s, i, latex) {
    while (s[i] === ' ') i++;
    if (s[i] === '{' || s[i] === '(') { const j = close(s, i); return [s.slice(i + 1, j), j + 1]; }
    if (latex && s[i] === '\\') { const m = s.slice(i).match(/^\\[A-Za-z]+/); return [m[0], i + m[0].length]; }
    const m = s.slice(i).match(latex ? /^[A-Za-z0-9.]/ : /^[A-Za-z0-9.∞Ͱ-Ͽ]+/); return m ? [m[0], i + m[0].length] : ['', i];
  }
  function bounds(s, i, latex) {
    let lo = null, hi = null;
    for (let k = 0; k < 2; k++) {
      while (s[i] === ' ') i++;
      if (latex && s.startsWith('\\limits', i)) { i += 7; k--; continue; }
      if (latex && s.startsWith('\\nolimits', i)) { i += 9; k--; continue; }
      if (s[i] === '_') [lo, i] = bound(s, i + 1, latex); else if (s[i] === '^') [hi, i] = bound(s, i + 1, latex); else break;
    }
    return [lo, hi, i];
  }
  function differential(s, i, latex) {
    let d = 0;
    for (let j = i; j < s.length; j++) {
      const c = s[j];
      if ('{(['.includes(c)) d++; else if ('})]'.includes(c)) { if (!d) return null; d--; }
      else if (!d && c === 'd' && (j === i || /[\s})\]0-9,*]/.test(s[j - 1]) || s.startsWith('\\,', j - 2))) {
        const m = s.slice(j + 1).match(latex ? /^\s*(\\[A-Za-z]+|[A-Za-z])(?![A-Za-z0-9_])/ : /^\s*([A-Za-zͰ-Ͽ])(?![A-Za-z0-9_Ͱ-Ͽ])/);

  }
  function sumEnd(s, i) {

    if (s[j] === '-' || s[j] === '+') j++;
    for (; j < s.length; j++) {
      const c = s[j];
      if ('{(['.includes(c)) d++; else if ('})]'.includes(c)) { if (!d) return j; d--; }
      else if (!d && (c === '+' || c === '-' || c === '=' || c === '−') && !/[eE^_]$/.test(s.slice(0, j).trimEnd())) return j;
    }
    return s.length;
  }
  const INF = { '\\infty': 'Infinity', '∞': 'Infinity', '+\\infty': 'Infinity', '-\\infty': '-Infinity', '-∞': '-Infinity', '+∞': 'Infinity', '\\infinity': 'Infinity' };
  const bnd = (x, latex) => { if (x == null) return null; const t = x.replace(/\s+/g, ''); return INF[t] || structural(x, latex); };
  function matrix(cells, rowSep, colSep) {
    return '⟦' + cells.split(rowSep).map(r => r.trim()).filter(r => r).map(r => r.split(colSep).map(c => c.trim()).join(', ')).join('; ') + '⟧';
  }
  function structural(s, latex) {
    let out = '', i = 0;
    const L = latex ? '{' : '(', R = latex ? '}' : ')';

          else ex.push(U.note(`Equation ${e.i}: ${u} is a matrix or list; write equation with ${u} alone on left to solve for it.`));
        }
        else ex.push(U.note(`Equation ${e.i}: ${miss.length} unknowns (${miss.join(', ')}), give all but one to solve it.`));
      });

      let h = '<table class="tt"><thead><tr><th>' + t.tblNum + '</th><th>' + t.tblParsed + '</th><th>' + t.tblStatus + '</th></tr></thead><tbody>' + rows.map(r => '<tr><td>' + r[0] + '</td><td>' + r[1] + '<br><span style="font-size:.85rem; color:var(--ink-2)">' + r[3] + '</span></td><td>' + r[2] + '</td></tr>').join('') + '</tbody></table>';
      if (pairs.length) h += '<h3>' + t.rearr + '</h3>' + pairs.join('');
      if (ex.length) h += '<h3>' + t.workedEx + '</h3>' + ex.join('');
      return { html: h, work: [
        'Each equation is parsed into a symbolic expression tree (math.js) and evaluated as left side − right side; for matrices, every element must agree and both sides must have the same size.',
        'Domain: 200 random values per variable (30 if the equation contains integrals or sums), 0.2 to 10, log-spaced; both signs if "Any sign". Summation limits are whole numbers; data indexed in a sum (x_i) are lists.',
        'Definite integrals: adaptive Gauss–Kronrod (7/15-point) quadrature; infinite limits are mapped to a finite interval with x = a + t/(1 − t).',
        'Infinite sums: Euler–Maclaurin summation with N = 100, cross-checked at N = 200; sums with alternating signs are accelerated with Wynn\'s ε-algorithm.',
        'Indefinite integrals: the other side is differentiated numerically and compared with the integrand at 25 random points.',
        'Rearrangement: where one equation has a variable alone on the left, its value is substituted into the other; otherwise solved numerically. 12 random tests, relative tolerance 10⁻⁶.',
        'Worked example: with all values known the residual is tested; with one unknown it is evaluated directly or solved by bracketing and bisection.'] };
    }
  });
})();
</script>

<script>
(function () {
  const msg = t => document.getElementById('ra-msg').textContent = t;
  const setEqs = text => {
    const el = document.getElementById('eq-eqs');
    if (!el) return;
    el.value = text;
    el.dispatchEvent(new Event('input', { bubbles: true }));
  };

  const eqLines = t => t.split(/\r?\n|\r/)
    .map(s => s.replace(/[\u00A0\s]+/g, ' ').trim())
    .filter(s => s.length > 0 && /[^=<>!]=[^=]/.test(s));

  if (typeof Office === 'undefined') {
    msg('Running outside Office/Word. Paste equations directly into the text box below.');
    return;
  }

  Office.onReady(info => {
    if (info.host !== Office.HostType.Word) {
      msg('Running outside Word. Paste equations directly into the text box below.');
      return;
    }

    if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
      document.body.className = 'quarto-dark';
    } else {
      document.body.className = 'quarto-light';
    }

    document.getElementById('ra-sel').onclick = () => Word.run(async ctx => {
      const selection = ctx.document.getSelection();
      const ooxml = selection.getOoxml();
      await ctx.sync();

      const parser = new DOMParser();
      const xmlDoc = parser.parseFromString(ooxml.value, "text/xml");
      const mathNodes = xmlDoc.getElementsByTagName("m:oMath");

      let extractedEqs = [];

      if (mathNodes.length > 0) {
        for (let node of mathNodes) {
          let eqText = window.ommlToLinear(node);
          if (eqText && eqText.includes('=')) {
            extractedEqs.push(eqText);
          }
        }
      }

      if (extractedEqs.length === 0) {
        selection.load('text');
        await ctx.sync();
        extractedEqs = eqLines(selection.text || '');
      }

      if (!extractedEqs.length) {
        msg('No valid equation with "=" found in the selection.');
        return;
      }

      setEqs(extractedEqs.join('\n'));
      msg(`Cleanly loaded ${extractedEqs.length} equation(s) from Word selection.`);
    }).catch(e => msg('Error reading document selection: ' + e.message));

    document.getElementById('ra-doc').onclick = () => Word.run(async ctx => {
      const ps = ctx.document.body.paragraphs; ps.load('items/text'); await ctx.sync();
      const lines = ps.items.flatMap(p => eqLines(p.text || ''));
      if (!lines.length) { msg('No equation-like lines found in the document.'); return; }
      setEqs(lines.slice(0, 60).join('\n')); msg(`Found ${lines.length} equation-like line(s).`);
    }).catch(e => msg('Error reading document: ' + e.message));

    document.getElementById('ra-com').onclick = () => Word.run(async ctx => {
      const res = document.querySelector('#eq .res');
      const bad = res ? [...res.querySelectorAll('.note.bad')].map(n => n.textContent.trim()) : [];
      const tags = res ? [...res.querySelectorAll('tbody tr')].filter(tr => tr.querySelector('.tag.bad, .tag.warn')).map(tr => `Eq ${tr.cells[0].textContent}: ${tr.cells[2].textContent.trim()}, ${tr.cells[1].querySelector('span') ? tr.cells[1].querySelector('span').textContent.trim() : ''}`) : [];
      const text = (tags.concat(bad).join('\n') || 'Equation check: no problems found.') + '\n(Equation checker, https://doi.org/10.5281/zenodo.23787685)';
      const r = ctx.document.getSelection();
      if (Office.context.requirements.isSetSupported('WordApi', '1.4')) { r.insertComment(text); await ctx.sync(); msg('Comment added to the selection.'); }
      else { r.insertText('\n[' + text + ']', 'After'); await ctx.sync(); msg('Findings inserted as text after selection.'); }
    }).catch(e => msg('Could not add comment: ' + e.message));
  });
})();
</script>
