            if (restIdx && !e.weights.some(w => w.name === fs[wi].name.slice(0, -(v.length + 1)))) e.weights.push({ name: fs[wi].name.slice(0, -(v.length + 1)), N: 'N_' + v });
          }));
          e.kinds = shapes(e, known); e.vs = Object.keys(e.kinds); e.readAs = readAs; e.row = rows.length; rows.push(null); E.push(e);
        } catch (err) { push([lab, U.esc(ln), '<span class="tag bad">Cannot read</span>', U.esc(err.message) + (/,[^,]*-[^,]*\./.test(ln) && /[\u{1D400}-\u{1D7FF}\u2212]/u.test(ln) ? ' This is Word\'s flattened text, which loses fractions, subscripts and powers. Highlight the equation in Word and click "Check the selected equations", or copy it in Word and paste it straight into this box.' : '')]); }
      });

      const shared = {}; E.forEach(e => { if (!e.skip) for (const [x, k] of Object.entries(e.kinds)) if (k !== 's' && (!shared[x] || k.startsWith('sz:'))) shared[x] = k; });
      E.forEach(e => {
        if (e.skip) return; const k2 = { ...e.kinds }; let changed = false;
        for (const x of e.vs) if (shared[x] && k2[x] !== shared[x]) { k2[x] = shared[x]; changed = true; }
        if (!changed) return;
        if (e.mctx) { e.kinds = k2; e.sharedSizes = true; }
        else if ([0, 1, 2].some(() => isFinite(residual(e, scopeOf(k2, true)).scale))) e.kinds = k2;
      });
      // a quantity defined by another equation (CN = …) that this one uses (CN_sd = √(… − CN²))
      const definesSym = D => D.lhsSym && !Object.keys(freeVars(D.R)).includes(D.lhsSym);
      E.forEach(e => { if (!e.skip) e.deps = E.filter(D => D !== e && !D.skip && definesSym(D) && D.lhsSym !== e.lhsSym && e.vs.includes(D.lhsSym) && !(e.lhsSym && D.vs.includes(e.lhsSym))); });
      E.forEach(e => {
        if (e.skip) return;
        const n = e.vs.length ? (e.heavy ? 30 : 200) : 1;
        const trial = () => { const o = { bad: 0, ex: null, mism: 0, held: 0, miss: null, cx: 0 };
          for (let k = 0; k < n; k++) {
            const sc = scopeOf(e.kinds, pos); const r = residual(e, sc);
            if (!isFinite(r.scale) || !isFinite(r.res)) { o.bad++; if (!o.ex) o.ex = sc; if (!sides(e, sc)) { if (LASTCX) { o.cx++; if (!o.cxSc) o.cxSc = sc; } else o.mism++; } }
            else if (r.res / r.scale < 1e-6) o.held++; else if (!o.miss) o.miss = { sc, val: r.val };
          } return o; };
        let T = trial();
        // undefined in places on its own: try again with the other equations' definitions plugged in
        // √ or log of a negative only because a matrix was general: try covariance-type matrices
        // (symmetric, positive definite), e.g. Σ in (x − μ)ᵀ Σ⁻¹ (x − μ)
        if (T.cx && Object.values(e.kinds).includes('m')) { SPD = true; const T2 = trial(); SPD = false; if (T2.bad < T.bad) { T = T2; e.spd = true; } }
        if (T.bad && e.deps.length) {
          // the paper's own definition (CN from equation 1) is the right one to test with; drop it
          // only if it makes the equation unreadable for a reason other than a complex value
          e.useDeps = true; const T2 = trial();
          if (T2.bad < n || T2.cx || T.bad === n) T = T2; else e.useDeps = false;
        }
        let { bad, ex, mism, held, miss, cx, cxSc } = T;
        const defines = e.lhsSym && !Object.keys(freeVars(e.R)).includes(e.lhsSym);
        const ok = n - bad;
        e.identity = ok > 0 && held === ok;
        let tag, txt = '';
        const kindTxt = Object.entries(e.kinds).filter(([, k]) => k !== 's').map(([x, k]) => `${x} (${{ int: 'whole number', vec: 'list', m: '2×2 matrix', v: '2×1 vector', tab1: 'list', tab2: 'table', tab3: 'table' }[k] || k.replace('sz:', '').replace('x', '×')})`);
        const scTxt = sc => Object.entries(sc).filter(([, x]) => !isArr(x)).map(([a, b]) => `${a} = ${HM.fmt(b, 3)}`).join(', ');
        if (bad === n) { tag = '<span class="tag bad">Never evaluates</span>'; txt = mism === n && e.vs.length ? (e.sharedSizes ? ' Variable dimensions mismatch across equations.' : ' Matrices or expressions cannot be evaluated.') : ' Expression does not produce real finite numbers.'; }
        else if (e.identity && !defines) { tag = '<span class="tag good">Holds</span>'; txt = e.vs.length ? ` Both sides agree for all ${ok} test values.` : ' Both sides agree.'; }
        else if (!defines && (e.heavy || !e.vs.length)) { tag = '<span class="tag bad">Does not hold</span>'; e.fails = true; const [l, r] = miss.val; txt = ` Left side is ${fmtV(l)} and right side is ${fmtV(r)}.`; }
        else if (e.grad && miss) { tag = '<span class="tag bad">Does not hold</span>'; e.fails = true; txt = ` ∇_${e.grad.c} ${pretty(e.grad.name)} should be (${[...e.grad.c].map(c => `∂${pretty(e.grad.name)}/∂${c}`).join(', ')}), in that order; the right side differs.`; }
        else tag = bad === 0 ? '<span class="tag good">Evaluates cleanly</span>' : '<span class="tag warn">Undefined in places</span>';
        if (bad && bad < n) txt += ` Undefined for ${Math.round(100 * bad / n)}% of test values${scTxt(ex) ? `, e.g. ${scTxt(ex)}` : ''}.`;
        if (bad && cx) {
          if (cx === n) txt = txt.replace(' Expression does not produce real finite numbers.', '');
          txt += ' ' + cxReason(e, cxSc) + (e.useDeps ? ` (with ${e.deps.map(D => `${pretty(D.lhsSym)} from equation ${D.i}`).join(', ')})` : '') + '.';
        }
        const N_ = Object.keys(e.kinds).filter(x => /^N_/.test(x));
        if (N_.length) txt += ` Sums written without limits run over all categories (1 … ${N_.join(', ')}).` + (e.weights.length ? ` ${e.weights.map(w => w.name).join(' and ')} ${e.weights.length > 1 ? 'are' : 'is'} taken as weights that sum to 1.` : '');
        if (e.spd) { const ms = Object.keys(e.kinds).filter(x => e.kinds[x] === 'm'); txt += ` ${ms.map(pretty).join(', ')} ${ms.length > 1 ? 'are' : 'is'} taken as a covariance matrix (symmetric, positive definite); with a general matrix the value under √ can be negative.`; }
        if (e.useDeps) txt += ` ${e.deps.map(D => `${pretty(D.lhsSym)} is taken from equation ${D.i}`).join('; ')}.`;
        if (e.grad && e.identity) txt = ` The components are the partial derivatives of ${pretty(e.grad.name)} with respect to ${[...e.grad.c].join(' and ')}, in order.`;
        rows[e.row] = [e.i, e.readAs, tag, `Variables: ${e.vs.join(', ') || 'none'}${kindTxt.length ? `; sizes: ${kindTxt.join(', ')}` : ''}.${txt}`, e.li];
      });

      // Rearrangement consistency tests
      let samePairs = 0;
      const pairs = [], EE = E.filter(e => !e.skip), RR = EE.filter(e => !e.fails && !(e.identity && (e.heavy || !e.vs.length)));
      for (let a = 0; a < RR.length; a++) for (let b = a + 1; b < RR.length; b++) {
        const A = RR[a], B = RR[b], sa = A.vs.slice().sort().join(), sb = B.vs.slice().sort().join();
        if (!A.vs.length || sa !== sb) continue;
        samePairs++;
        const iso = X => X.lhsSym && !Object.keys({ ...freeVars(X.R) }).includes(X.lhsSym) ? X.lhsSym : null;
        const u = iso(B) || iso(A) || (B.lhsSym && B.vs.includes(B.lhsSym) ? B.lhsSym : A.lhsSym && A.vs.includes(A.lhsSym) ? A.lhsSym : A.vs[0]);
        const [P, Q] = B.lhsSym === u ? [A, B] : [B, A];
        const kinds = { ...P.kinds, ...Q.kinds };
        let ok = 0, tried = 0, fail = null;
        for (let k = 0; k < 40 && tried < 12; k++) {
          const sc = scopeOf(kinds, pos); delete sc[u];
          let r;
          if (iso(Q) === u) { try { r = Q.Rc.evaluate({ ...sc }); } catch (e) { continue; } }
          else if (kinds[u] === 's') { const g = x => { try { return real(Q.Lc.evaluate({ ...sc, [u]: x })) - real(Q.Rc.evaluate({ ...sc, [u]: x })); } catch (e) { return NaN; } }; r = root(g); if (r == null) continue; }
          else continue;
          if (!isArr(r) && !isFinite(real(r))) continue;
          tried++;
          const rs = residual(P, { ...sc, [u]: r });
          if (isFinite(rs.res) && rs.res / rs.scale < 1e-6) ok++; else if (!fail) fail = { sc, r, res: rs.res };
        }
        if (!tried) continue;
        const scTxt = f => Object.entries(f.sc).filter(([, x]) => !isArr(x)).map(([a, b]) => `${a} = ${HM.fmt(b, 3)}`).join(', ');
        pairs.push(ok === tried ? U.note(`Equation ${Q.i} is consistent with equation ${P.i}: solving ${Q.i} for ${u} satisfies ${P.i} in all ${tried} random tests.`, 'good')
          : U.note(`Equation ${Q.i} does not follow from equation ${P.i}.${scTxt(fail) ? ` For ${scTxt(fail)},` : ''} equation ${Q.i} gives ${u} = ${fmtV(fail.r)}, which leaves equation ${P.i} off by ${isFinite(fail.res) ? HM.fmt(fail.res, 4) : 'an undefined amount'}.`, 'bad'));
      }

      // Worked example solving
      const ex = [];
      if (Object.keys(known).length) RR.forEach(e => {
        const miss = e.vs.filter(x => !(x in known));
        if (miss.length === 0) { const r = residual(e, { ...known }); ex.push(isFinite(r.res) && r.res / r.scale < 1e-3 ? U.note(`Equation ${e.i} holds for the example values.`, 'good') : U.note(`Equation ${e.i} does not hold for the example: left side − right side = ${isFinite(r.res) ? (r.val ? fmtV(MJ.subtract(r.val[0], r.val[1])) : HM.fmt(r.res, 4)) : 'undefined'}.`, 'bad')); }
        else if (miss.length === 1) {
          const u = miss[0];
          if (e.lhsSym === u && !Object.keys(freeVars(e.R)).includes(u)) { let r; try { r = e.Rc.evaluate({ ...known }); } catch (err) { r = NaN; } ex.push(isArr(r) || isFinite(real(r)) ? U.note(`Equation ${e.i} gives <b>${u} = ${fmtV(r)}</b> from the example values.`, 'good') : U.note(`Equation ${e.i}: ${u} could not be evaluated from example values.`, 'bad')); }
          else if (e.kinds[u] === 's') { const first = d => isArr(d) ? real(MJ.flatten(MJ.matrix(d)).valueOf()[0]) : real(d); const r0 = root(x => { try { return first(MJ.subtract(e.Lc.evaluate({ ...known, [u]: x }), e.Rc.evaluate({ ...known, [u]: x }))); } catch (err) { return NaN; } }); const chk = r0 == null ? null : residual(e, { ...known, [u]: r0 }); const r = chk && chk.res / chk.scale < 1e-6 ? r0 : null; if (r0 != null && r == null) { ex.push(U.note(`Equation ${e.i}: ${u} = ${HM.fmt(r0, 5)} satisfies first row but not others.`, 'bad')); return; } ex.push(r == null ? U.note(`Equation ${e.i}: no real ${u} satisfies it with example values.`, 'bad') : U.note(`Equation ${e.i} gives <b>${u} = ${HM.fmt(r, 5)}</b> from example values.`, 'good')); }
          else ex.push(U.note(`Equation ${e.i}: ${u} is a matrix or list; write equation with ${u} alone on left to solve for it.`));
        }
        else ex.push(U.note(`Equation ${e.i}: ${miss.length} unknowns (${miss.join(', ')}), give all but one to solve it.`));
      });

      // the status is a button: click it to switch that equation off (or back on)
      const stBtn = r => r[4] == null ? r[2] : '<button type="button" class="st" data-line="' + r[4] + '" title="' + U.esc(r[5] ? t.turnOn : t.turnOff) + '">' + r[2] + '</button>';
      let h = '<p class="hint" style="margin:0 0 4px">' + t.clickHint + '</p><table class="tt"><thead><tr><th>' + t.tblNum + '</th><th>' + t.tblParsed + '</th><th>' + t.tblStatus + '</th></tr></thead><tbody>' + rows.map(r => '<tr' + (r[5] ? ' class="off"' : '') + '><td>' + r[0] + '</td><td>' + r[1] + '<br><span style="font-size:.85rem; color:var(--ink-2)">' + r[3] + '</span></td><td>' + stBtn(r) + '</td></tr>').join('') + '</tbody></table>';
      if (badVals.length) h = U.note('Could not read these value entries (ignored): ' + badVals.map(x => U.esc(x)).join('; '), '') + h;
      if (pairs.length) h += '<h3>' + t.rearr + '</h3>' + pairs.join('');
      if (ex.length) h += '<h3>' + t.workedEx + '</h3>' + ex.join('');
      return { html: h, work: [
        'Each equation is parsed into a symbolic expression tree (math.js) and evaluated as left side − right side; for matrices, every element must agree and both sides must have the same size.',
        'Domain: 200 random values per variable (30 if the equation contains integrals or sums), 0.2 to 10, log-spaced; both signs if "Any sign". Summation limits are whole numbers; data indexed in a sum (x_i) are lists.',
        'Definite integrals: adaptive Gauss–Kronrod (7/15-point) quadrature; infinite limits are mapped to a finite interval with x = a + t/(1 − t).',
        'Infinite sums: Euler–Maclaurin summation with N = 100, cross-checked at N = 200; sums with alternating signs are accelerated with Wynn\'s ε-algorithm.',
        'Indefinite integrals: the other side is differentiated numerically and compared with the integrand at 25 random points.',
        'Rearrangement: where one equation has a variable alone on the left, its value is substituted into the other; otherwise solved numerically. 12 random tests, relative tolerance 10⁻⁶.',
        'Worked example: with all values known the residual is tested; with one unknown it is evaluated directly or solved by bracketing and bisection.'] };
    }
  });
})();
</script>

<p class="ra-foot" id="ra-foot"></p>

<script>
(function () {
  const msg = t => document.getElementById('ra-msg').textContent = t;
  const box = () => document.getElementById('eq-eqs');
  const setEqs = text => { const el = box(); if (!el) return; el.value = text; el.dispatchEvent(new Event('input', { bubbles: true })); };
  const eqLines = t => t.split(/\r?\n|\r/).map(s => s.replace(/[\u00A0\s]+/g, ' ').trim()).filter(s => s.length > 0 && s.length < 400 && /[^=<>!]=[^=]/.test(s));
  const withEquals = xs => { const w = xs.filter(x => /[^=<>!]=[^=]/.test(x)); return w.length ? w : xs; };
  const plural = n => `${n} equation${n === 1 ? '' : 's'}`;

  // Paste: when the clipboard comes from Word it carries the equation's OMML in its
  // HTML. Read that instead of the flattened plain text (which mixes up fractions,
  // subscripts and powers). Works in Word's panel and in a normal browser.
  document.addEventListener('paste', ev => {
    const el = ev.target;
    if (!el || el.id !== 'eq-eqs' || !ev.clipboardData) return;
    let eqs = [];
    try { eqs = window.equationsFromClipboardHtml(ev.clipboardData.getData('text/html')); } catch (e) { console.warn(e); }
    if (!eqs.length) return;                       // not from Word: normal paste
    ev.preventDefault();
    const s = el.selectionStart ?? el.value.length, t = el.selectionEnd ?? el.value.length;
    const before = el.value.slice(0, s), after = el.value.slice(t);
    const ins = (before && !before.endsWith('\n') ? '\n' : '') + eqs.join('\n') + (after && !after.startsWith('\n') ? '\n' : '');
    el.value = before + ins + after;
    el.selectionStart = el.selectionEnd = (before + ins).length;
    el.dispatchEvent(new Event('input', { bubbles: true }));
    msg(`Read ${plural(eqs.length)} from the Word equation you pasted.`);
  }, true);

  if (typeof Office === 'undefined') { msg('Running outside Word. Paste equations into the box below.'); return; }

  Office.onReady(info => {
    if (info.host !== Office.HostType.Word) { msg('Running outside Word. Paste equations into the box below.'); return; }
    document.body.className = ((window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'quarto-dark' : 'quarto-light') + ' in-word';

    // Selection: read the selection's OOXML so Word equations keep their structure.
    // quiet = called automatically on a selection change: say nothing if there is no equation.
    let lastAuto = '';
    const readSelection = quiet => Word.run(async ctx => {
      const sel = ctx.document.getSelection();
      const ox = sel.getOoxml(); await ctx.sync();
      let eqs = withEquals(window.equationsFromOoxml(ox.value, eqLines));
      if (!eqs.length) { sel.load('text'); await ctx.sync(); eqs = eqLines(sel.text || ''); }
      if (!eqs.length) { if (!quiet) msg('No equations found in the selection. Highlight one or more equations (Word equations or typed lines with "=").'); return; }
      const text = eqs.join('\n');
      if (quiet && text === lastAuto) return;      // same equations as last time: leave the box (and any lines switched off) alone
      lastAuto = text;
      setEqs(text); msg(`Read ${plural(eqs.length)} from the selection.`);
    }).catch(e => { if (!quiet) msg('Could not read the selection: ' + e.message); });
    // leaving the document results (their colours are cleared) before reading a selection
    document.getElementById('ra-sel').onclick = async () => { if (window.RA_DOC && window.RA_DOC.active()) await window.RA_DOC.clear(); readSelection(false); };

    // Check automatically when the selection changes (switch off with the tick box under the language menu)
    let timer = null;
    const autoOn = () => { try { return localStorage.getItem('ra-auto') !== '0'; } catch (e) { return true; } };
    Office.context.document.addHandlerAsync(Office.EventType.DocumentSelectionChanged, () => {
      // paused while document results are shown (and right after jumping to an equation), so clicking around Word keeps the list
      if (!autoOn() || window.RA_VIEW !== 'eq' || (window.RA_DOC && window.RA_DOC.active())) return;
      clearTimeout(timer); timer = setTimeout(() => readSelection(true), 350);
    });

    // Whole document: same OOXML route. Paragraphs without a Word equation only count when
    // they look like a formula, not a sentence that happens to contain "=" (e.g. "n = 30 samples were ...").
    const formulaLike = s => s.length < 120 && (s.match(/[A-Za-z]{4,}/g) || []).filter(w => !/^(sqrt|exp|log|sin|cos|tan|sinh|cosh|tanh|frac|left|right|partial|nabla|alpha|beta|gamma|delta|Delta|theta|lambda|sigma|Sigma|omega|Omega|infty|cdot|times|mathrm|text|bar|hat)$/.test(w)).length <= 2;
    // ---------- whole document: colour each equation by its status; click a row to go to it ----------
    // docMode.places[i] = where line i of the box came from: { t: text, p: paragraph index, display }
    let docMode = null;
    const applied = new Map();   // paragraph index -> { orig: formatting before, cat: colour now, skip }
    const COL = { holds: ['#2E9E5B', 'Lime'], clean: ['#2F6FDE', 'Turquoise'], unread: ['#C99A00', 'Yellow'], bad: ['#D13438', 'Pink'] };
    const RANK = { bad: 4, unread: 3, clean: 2, holds: 1 };
    const colourLine = () => Office.context.requirements.isSetSupported('WordApiDesktop', '1.3');   // underline colour: desktop Word only
    const strip = s => String(s).replace(/^\s*#\s?/, '').trim();
    const docbar = on => { const b = document.getElementById('ra-docbar'); if (b) b.hidden = !on; const q = document.getElementById('eq'); if (q) q.classList.toggle('has-places', on); };
    let jumpUntil = 0;   // ignore the selection change our own jump causes
    function lineStatuses() {   // box line -> colour, read from the result table (worst row wins)
      const out = {};
      document.querySelectorAll('#eq tbody tr').forEach(tr => {
        const b = tr.querySelector('button.st'), tag = tr.querySelector('.tag'); if (!b || !tag) return;
        const li = +b.dataset.line;
        if (tr.classList.contains('off')) { out[li] = null; return; }
        const t = tag.textContent.trim().toLowerCase();
        const c = /cannot read|not one equation|not checked/.test(t) ? 'unread' : tag.classList.contains('bad') ? 'bad' : tag.classList.contains('warn') ? 'unread' : /holds/.test(t) ? 'holds' : 'clean';
        if (out[li] !== null && (!out[li] || RANK[c] > RANK[out[li]])) out[li] = c;
      });
      return out;
    }
    function targets() {        // paragraph -> colour, for display equations whose line is unchanged in the box
      const st = lineStatuses(), lines = String(box().value).split(/\r?\n/), want = new Map();
      docMode.places.forEach((pl, i) => {
        if (lines[i] == null || strip(lines[i]) !== pl.t || !pl.display || !st[i]) return;
        const cur = want.get(pl.p); if (!cur || RANK[st[i]] > RANK[cur]) want.set(pl.p, st[i]);
      });
      return want;
    }
    const restore = (f, o, line) => { f.underline = o.u === 'Mixed' ? 'None' : o.u; if (line && o.uc) f.underlineColor = o.uc; f.highlightColor = o.h || null; };
    let busy = false, again = false;
    async function recolour() {
      if (!docMode) return;
      if (busy) { again = true; return; }
      busy = true;
      try {
        await Word.run(async ctx => {
          const paras = ctx.document.body.paragraphs; paras.load('items'); await ctx.sync();
          if (paras.items.length !== docMode.count) { msg('The document has changed since it was checked. Click "Find all equations in the document" again to update the colours.'); return; }
          const want = targets(), line = colourLine();
          // remember the formatting of paragraphs coloured for the first time, so "Clear the colours" can put it back
          const fresh = [...want.keys()].filter(p => !applied.has(p)).map(p => { const r = paras.items[p].getRange('Content'); r.load(line ? 'font/underline,font/underlineColor,font/highlightColor' : 'font/underline,font/highlightColor'); return [p, r]; });
          if (fresh.length) await ctx.sync();
          fresh.forEach(([p, r]) => { const f = r.font; applied.set(p, { orig: { u: f.underline, uc: line ? f.underlineColor : null, h: f.highlightColor }, cat: null, skip: f.underline !== 'None' || !!f.highlightColor }); });
          applied.forEach((a, p) => {
            const c = want.get(p) || null;
            if (a.skip || a.cat === c) return;
            const f = paras.items[p].getRange('Content').font;
            if (!c) restore(f, a.orig, line);
            else if (line) { f.underline = 'Thick'; f.underlineColor = COL[c][0]; }
            else f.highlightColor = COL[c][1];
            a.cat = c;
          });
          await ctx.sync();
        });
      } catch (e) { msg('Could not colour the equations: ' + e.message); }
      busy = false;
      if (again) { again = false; recolour(); }
    }
    async function clearColours() {
      if (applied.size) await Word.run(async ctx => {
        const paras = ctx.document.body.paragraphs; paras.load('items'); await ctx.sync();
        const line = colourLine();
        applied.forEach((a, p) => { if (a.cat && !a.skip && paras.items[p]) restore(paras.items[p].getRange('Content').font, a.orig, line); });
        await ctx.sync();
      }).catch(e => msg('Could not clear the colours: ' + e.message));
      applied.clear(); docMode = null; docbar(false);
    }
    let rt = null;
    window.addEventListener('ra-eq-run', () => { if (docMode) { clearTimeout(rt); rt = setTimeout(recolour, 400); } });

    document.getElementById('ra-doc').onclick = async () => {
      await clearColours();
      await Word.run(async ctx => {
        const paras = ctx.document.body.paragraphs; paras.load('items');
        const ox = ctx.document.body.getOoxml(); await ctx.sync();
        const found = window.equationPlaces(ox.value, t => eqLines(t).filter(formulaLike));
        const items = found.items.filter(x => /[^=<>!]=[^=]/.test(x.t));
        if (!items.length) { msg('No equations found in the document.'); return; }
        const shown = items.slice(0, 60), inline = shown.filter(x => !x.display).length;
        // positions are trusted only when the paragraph count read from the document matches Word's own
        docMode = found.count === paras.items.length ? { places: shown, count: found.count } : null;
        docbar(!!docMode);
        setEqs(shown.map(x => x.t).join('\n'));
        msg(`Found ${plural(items.length)}${items.length > 60 ? ' (first 60 shown)' : ''}. Remove any that aren't equations.` +
          (docMode ? ' They are coloured in the document by status; clear the colours before you send it.' + (inline ? ` ${inline} inside a line of text ${inline === 1 ? 'is' : 'are'} not coloured; click ${inline === 1 ? 'its' : 'their'} row to go to ${inline === 1 ? 'it' : 'them'}.` : '')
            : ' Their positions in the document could not be matched, so they are not coloured.'));
      }).catch(e => msg('Could not read the document: ' + e.message));
    };
    document.getElementById('ra-clr').onclick = () => clearColours().then(() => msg('Colours cleared.'));
    window.RA_DOC = { active: () => !!docMode || Date.now() < jumpUntil, clear: clearColours };

    // click a row (not its status) to go to that equation in the document
    document.getElementById('eq').addEventListener('click', e => {
      if (!docMode || e.target.closest('button')) return;
      const tr = e.target.closest('tbody tr'), b = tr && tr.querySelector('button.st'); if (!b) return;
      const li = +b.dataset.line, pl = docMode.places[li], line = String(box().value).split(/\r?\n/)[li];
      if (!pl || strip(line) !== pl.t) { msg('This line has been edited, so its place in the document is not known.'); return; }
      Word.run(async ctx => {
        const paras = ctx.document.body.paragraphs; paras.load('items'); await ctx.sync();
        if (paras.items.length !== docMode.count) { msg('The document has changed since it was checked. Click "Find all equations in the document" again.'); return; }
        jumpUntil = Date.now() + 2000;
        paras.items[pl.p].select(); await ctx.sync();
      }).catch(err => msg('Could not go to the equation: ' + err.message));
    });

    document.getElementById('ra-com').onclick = () => Word.run(async ctx => {
      const res = document.querySelector('#eq .res');
      const bad = res ? [...res.querySelectorAll('.note.bad')].map(n => n.textContent.trim()) : [];
      const tags = res ? [...res.querySelectorAll('tbody tr')].filter(tr => tr.querySelector('.tag.bad, .tag.warn')).map(tr => `Eq ${tr.cells[0].textContent}: ${tr.cells[2].textContent.trim()}, ${tr.cells[1].querySelector('span') ? tr.cells[1].querySelector('span').textContent.trim() : ''}`) : [];
      const text = (tags.concat(bad).join('\n') || 'Equation check: no problems found.') + '\n(Equation checker, https://doi.org/10.5281/zenodo.23787685)';
      const r = ctx.document.getSelection();
      if (Office.context.requirements.isSetSupported('WordApi', '1.4')) { r.insertComment(text); await ctx.sync(); msg('Comment added to the selection.'); }
      else { r.insertText('\n[' + text + ']', 'After'); await ctx.sync(); msg('Findings inserted as text after the selection.'); }
    }).catch(e => msg('Could not add the comment: ' + e.message));
  });
})();
</script>
<script>
/* The add-in's frame: title, language, the list of checks, the action buttons (locked in this beta
   except on the equation checker), "All checks" and "Tools on the website". */
(function () {
  const MORE_URL = window.RA_MORE = 'https://rafikiardhi.earth/';             // "Learn more" on a locked button: change when the page exists
  const TOOLS_URL = 'https://rafikiardhi.earth/tools.html';  // "Tools on the website"
  const C = window.RA_CHECKS;
  const UI = {
    en: {
      home: 'Check a result', sub: 'No AI. Runs in this panel; nothing leaves your computer.', lang: 'Language',
      intro: 'Choose a check. Type or paste the numbers from the paper; each check tests whether they hold together.',
      all: 'All checks', back: '← All checks', web: 'Tools on the website ↗', pick: 'Check',
      sel: 'Check the highlighted text', doc: 'Check the whole document', com: 'Add the findings as a comment',
      eqSel: 'Check the selected equations', eqDoc: 'Find all equations in the document', eqCom: 'Add the findings as a comment',
      locked: 'Locked in this beta. This will read the numbers from your document for you; for now, type or paste them into the boxes below.', more: 'Learn more', ckLock: 'This check is locked in this beta. You can see what it asks for and the papers behind it.',
      auto: 'Check equations automatically when I select them', clr: 'Clear the colours', lg: ['Holds', 'Evaluates cleanly', 'Not checked or partly undefined', 'Does not hold'], go: 'Click a row to go to that equation in the document.',
      cite: 'Check a result for Word: plausibility checks and an equation checker for soil and environmental results', how: 'How to cite'
    },
    sw: {
      home: 'Kagua matokeo', sub: 'Bila AI. Inafanya kazi hapa tu; hakuna kinachotoka kwenye kompyuta yako.', lang: 'Lugha',
      intro: 'Chagua ukaguzi. Andika au bandika namba kutoka kwenye jarida; kila ukaguzi unapima kama zinaendana.',
      all: 'Ukaguzi wote', back: '← Ukaguzi wote', web: 'Zana kwenye tovuti ↗', pick: 'Ukaguzi',
      sel: 'Kagua maandishi yaliyochaguliwa', doc: 'Kagua waraka wote', com: 'Weka matokeo kama maoni (comment)',
      eqSel: 'Kagua milinganyo iliyochaguliwa', eqDoc: 'Tafuta milinganyo yote kwenye waraka', eqCom: 'Weka matokeo kama maoni (comment)',
      locked: 'Imefungwa katika toleo hili la majaribio (beta). Kipengele hiki kitasoma namba kutoka kwenye waraka wako; kwa sasa, andika au bandika namba kwenye visanduku hapa chini.', more: 'Soma zaidi', ckLock: 'Ukaguzi huu umefungwa katika toleo hili la majaribio (beta). Unaweza kuona unachohitaji na makala zinazouunga mkono.',
      auto: 'Kagua milinganyo moja kwa moja ninapoichagua', clr: 'Ondoa rangi', lg: ['Unashikilia', 'Unakokotoleka vizuri', 'Haukukaguliwa au haufafanuki mahali fulani', 'Haushikilii'], go: 'Bofya mstari ili kwenda kwenye mlinganyo huo katika waraka.',
      cite: 'Check a result for Word: plausibility checks and an equation checker for soil and environmental results', how: 'Jinsi ya kunukuu'
    },
    es: {
      home: 'Comprobar un resultado', sub: 'Sin IA. Se ejecuta en este panel; nada sale de su computadora.', lang: 'Idioma',
      intro: 'Elija una comprobación. Escriba o pegue los números del artículo; cada comprobación verifica si son coherentes.',
      all: 'Todas las comprobaciones', back: '← Todas las comprobaciones', web: 'Herramientas en el sitio web ↗', pick: 'Comprobación',
      sel: 'Revisar el texto resaltado', doc: 'Revisar todo el documento', com: 'Agregar hallazgos como comentario',
      eqSel: 'Revisar las ecuaciones seleccionadas', eqDoc: 'Buscar todas las ecuaciones en el documento', eqCom: 'Agregar hallazgos como comentario',
      locked: 'Bloqueado en esta beta. Esto leerá los números de su documento por usted; por ahora, escríbalos o péguelos en las casillas de abajo.', more: 'Más información', ckLock: 'Esta comprobación está bloqueada en esta beta. Puede ver qué datos pide y los artículos en que se basa.',
      auto: 'Revisar las ecuaciones automáticamente al seleccionarlas', clr: 'Quitar los colores', lg: ['Se cumple', 'Se evalúa sin problemas', 'No revisada o indefinida en partes', 'No se cumple'], go: 'Haga clic en una fila para ir a esa ecuación en el documento.',
      cite: 'Check a result for Word: plausibility checks and an equation checker for soil and environmental results', how: 'Cómo citar'
    }
  };
  const $ = id => document.getElementById(id);
  const esc = HM.esc;
  let lang = HM.lang;
  let view = 'home'; try { const v = localStorage.getItem('ra-view'); if (v && (v === 'home' || C.items[v])) view = v; } catch (e) { }
  const apis = {};   // the checks built so far
  const L = () => UI[lang] || UI.en;
  const tr = o => typeof o === 'string' ? o : (o[lang] || o.en);

  function openUrl(u) {
    try { if (window.Office && Office.context && Office.context.ui && Office.context.ui.openBrowserWindow) { Office.context.ui.openBrowserWindow(u); return; } } catch (e) { }
    window.open(u, '_blank', 'noopener');
  }

  function renderTop() {
    let auto = true; try { auto = localStorage.getItem('ra-auto') !== '0'; } catch (e) { }
    $('ra-top').innerHTML = '<select class="ra-lang" id="ra-lang" aria-label="' + esc(L().lang) + '">' +
      [['en', 'English'], ['sw', 'Kiswahili'], ['es', 'Español']].map(o => '<option value="' + o[0] + '"' + (o[0] === lang ? ' selected' : '') + '>' + o[1] + '</option>').join('') +
      '</select><label class="auto" id="ra-auto-wrap"' + (view === 'eq' ? '' : ' hidden') + '><input type="checkbox" data-auto' + (auto ? ' checked' : '') + '> ' + esc(L().auto) + '</label>';
  }
  function renderNav() {
    const groups = {};
    C.order.forEach(id => { const g = C.items[id].g; (groups[g] = groups[g] || []).push(id); });
    $('ra-tool').innerHTML = '<option value="home"' + (view === 'home' ? ' selected' : '') + '>' + esc(L().all) + '</option>' +
      Object.keys(groups).map(g => '<optgroup label="' + esc(tr(C.groups[g])[0]) + '">' +
        groups[g].map(id => '<option value="' + id + '"' + (id === view ? ' selected' : '') + '>' + (C.items[id].locked ? '🔒 ' : '') + esc(tr(C.items[id].t)) + '</option>').join('') + '</optgroup>').join('');
    $('ra-tool').setAttribute('aria-label', L().pick);
    $('ra-back').textContent = L().back;
    $('ra-web').textContent = L().web;
  }
  function renderHome() {
    const groups = {};
    C.order.forEach(id => { const g = C.items[id].g; (groups[g] = groups[g] || []).push(id); });
    $('view-home').innerHTML = '<p class="ra-intro">' + esc(L().intro) + '</p>' + Object.keys(groups).map(g => {
      const [title, sub] = tr(C.groups[g]);
      return '<h2 class="ra-gh">' + esc(title) + '</h2><p class="ra-gs">' + esc(sub) + '</p>' + groups[g].map(id => {
        const it = C.items[id];
        return '<button type="button" class="ra-card" data-open="' + id + '"><span class="ra-ct">' + (it.locked ? '🔒 ' : '') + esc(tr(it.t)) + (it.beta ? ' <span class="ra-beta">BETA</span>' : '') + '</span><span class="ra-cd">' + esc(tr(it.d)) + '</span></button>';
      }).join('');
    }).join('');
  }
  // a check's pane: intro, the form, references. Built the first time it is opened.
  function buildCheck(id) {
    const it = C.items[id], pane = document.querySelector('.ra-pane[data-pane="' + id + '"]');
    if (!pane || it.isEq) return;
    const keep = apis[id] ? apis[id].values() : undefined, wasRun = apis[id] && apis[id].ran && apis[id].ran();
    pane.innerHTML = '<p class="ra-intro">' + tr(it.intro) + '</p><div class="hmc" id="ck-' + id + '"></div>' +
      (it.refs ? '<details class="ra-refs"><summary>' + esc(tr(C.refsLab)) + '</summary>' + it.refs.map(r => '<p>' + tr(r) + '</p>').join('') + '</details>' : '');
    const cfg = it.build(lang);
    cfg.id = 'ck-' + id;
    cfg.initial = keep;
    cfg.initialRun = !!wasRun;
    if (it.locked) {   // shown so people can see what it does; the calculation is not run
      cfg.compute = () => '';
      apis[id] = HM.tool(cfg);
      const root = $('ck-' + id);
      root.classList.add('ra-locked');
      root.querySelectorAll('.res, .hm-work, .actions, .smallprint').forEach(x => x.remove());
      root.querySelectorAll('input, select, textarea, button').forEach(x => { x.disabled = true; });
      root.insertAdjacentHTML('afterbegin', '<div class="ra-lock">🔒 ' + esc(L().ckLock) + ' <a href="' + MORE_URL + '" data-ext>' + esc(L().more) + '</a></div>');
      return;
    }
    apis[id] = HM.tool(cfg);
  }
  function renderBar() {
    const isEq = view === 'eq', l = L();
    $('ra-bar').hidden = view === 'home';
    [['ra-sel', isEq ? l.eqSel : l.sel], ['ra-doc', isEq ? l.eqDoc : l.doc], ['ra-com', isEq ? l.eqCom : l.com]].forEach(([id, txt]) => {
      const b = $(id); b.textContent = (isEq ? '' : '🔒 ') + txt; b.classList.toggle('locked', !isEq); b.setAttribute('aria-disabled', String(!isEq));
    });
    $('ra-lock').hidden = true;
    // legend for the colours in the document (shown by the Word code after "Find all equations")
    const cols = ['#2E9E5B', '#2F6FDE', '#C99A00', '#D13438'];
    $('ra-legend').innerHTML = l.lg.map((t, i) => '<span><i style="background:' + cols[i] + '"></i>' + esc(t) + '</span>').join('') + '<span class="hint2">' + esc(l.go) + '</span>';
    $('ra-clr').textContent = l.clr;
    $('ra-docbar').classList.toggle('noteq', !isEq);
  }
  function renderHead() {
    const it = C.items[view];
    $('lbl-title').textContent = view === 'home' ? L().home : tr(it.t);
    $('lbl-sub').textContent = L().sub;
    $('ra-foot').innerHTML = esc(L().how) + ': Flynn, T. (2026). <i>' + esc(L().cite) + '</i> [Word add-in]. RafikiArdhi. ' +
      '<a href="https://doi.org/10.5281/zenodo.23813041" data-ext>https://doi.org/10.5281/zenodo.23813041</a>';
  }
  function show(id) {
    view = (id === 'home' || C.items[id]) ? id : 'home';
    window.RA_VIEW = view;
    try { localStorage.setItem('ra-view', view); } catch (e) { }
    $('view-home').hidden = view !== 'home';
    $('view-tool').hidden = view === 'home';
    document.querySelectorAll('.ra-pane').forEach(p => { p.hidden = p.dataset.pane !== view; });
    if (view !== 'home' && !C.items[view].isEq && !apis[view]) buildCheck(view);
    $('ra-back').hidden = view === 'home';
    $('ra-msg').hidden = view !== 'eq';
    const aw = $('ra-auto-wrap'); if (aw) aw.hidden = view !== 'eq';
    renderHead(); renderBar(); renderNav();
    window.scrollTo(0, 0);
  }
  function setLang(l) {
    lang = UI[l] ? l : 'en';
    try { localStorage.setItem('ra-lang', lang); } catch (e) { }
    HM.setLang(lang);
    if (window.HMEQ && HMEQ.setLang) HMEQ.setLang(lang);
    Object.keys(apis).forEach(buildCheck);   // rebuild the opened checks in the new language, keeping their values
    renderTop(); renderHome(); renderNav(); renderHead(); renderBar();
  }

  // panes for the checks (the equation checker's pane is already in the page)
  const holder = $('view-tool');
  C.order.forEach(id => { if (!C.items[id].isEq) { const d = document.createElement('div'); d.className = 'ra-pane'; d.dataset.pane = id; d.hidden = true; holder.appendChild(d); } });

  document.addEventListener('change', e => {
    if (e.target.id === 'ra-lang') setLang(e.target.value);
    else if (e.target.id === 'ra-tool') show(e.target.value);
    else if (e.target.matches('[data-auto]')) { try { localStorage.setItem('ra-auto', e.target.checked ? '1' : '0'); } catch (err) { } }
  });
  document.addEventListener('click', e => {
    const card = e.target.closest('[data-open]'); if (card) { show(card.dataset.open); return; }
    if (e.target.closest('#ra-back')) { show('home'); return; }
    if (e.target.closest('#ra-web')) { openUrl(TOOLS_URL); return; }
    const a = e.target.closest('a[data-ext]'); if (a) { e.preventDefault(); openUrl(a.href); return; }
  });
  // the three action buttons work on the equation checker; on the other checks they are locked
  $('ra-bar').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b || view === 'eq') return;
    e.preventDefault(); e.stopPropagation();
    const n = $('ra-lock');
    n.innerHTML = esc(L().locked) + ' <a href="' + MORE_URL + '" data-ext>' + esc(L().more) + '</a>';
    n.hidden = false;
  }, true);

  renderTop(); renderHome();
  show(view);
  window.RA_SHELL = { show, setLang };
})();

</script>
