<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Checks</title>
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.11.0/math.min.js"></script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

<style>
.hmc {
  --bg: #161412; --surface: #1f1c19; --surface-2: #2a2622; --ink: #f0ece4; --ink-2: #c4bdb1; --ink-3: #8f887d;
  --line: #3a352f; --accent: #d98b56; --accent-ink: #1a1410; --accent-soft: #3a2a1f; --warn: #e0a440; --good: #5cc28f; --bad: #e07070;
  color: var(--ink); font-size: 1.02rem; line-height: 1.5; max-width: 620px; margin: 8px auto 28px;
}
body.quarto-light .hmc {
  --bg: #f7f5f0; --surface: #fffdf9; --surface-2: #efebe2; --ink: #1f1c17; --ink-2: #57514a; --ink-3: #8a8379;
  --line: #ddd6ca; --accent: #8a4b22; --accent-ink: #ffffff; --accent-soft: #f3e6da; --warn: #9a6400; --good: #1f7a4d; --bad: #b3261e;
}
.hmc * { box-sizing: border-box; }
.hmc .cx { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-top: 12px; }
.hmc .step { font-size: .78rem; color: var(--ink-3); text-transform: uppercase; letter-spacing: .1em; font-weight: 600; margin: 0 0 6px; }
.hmc .hint { font-size: .9rem; color: var(--ink-2); margin: 6px 0 0; }
.hmc .fg { display: grid; grid-template-columns: repeat(6, 1fr); column-gap: 10px; }
.hmc .fg > div { grid-column: span 6; }
.hmc label { display: block; font-size: .9rem; font-weight: 600; color: var(--ink-2); margin: 10px 0 4px; }
.hmc textarea { width: 100%; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); font: .88rem ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; padding: 8px 12px; resize: vertical; display: block; }
.hmc input:focus, .hmc select:focus, .hmc textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.hmc .seg { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
.hmc .seg button { flex: 1 1 auto; min-height: 38px; border: 1px solid var(--line); background: transparent; color: var(--ink); border-radius: 999px; padding: 4px 12px; font: inherit; font-weight: 600; cursor: pointer; }
.hmc .seg button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.hmc .res { border: 2px solid var(--accent); overflow-x: auto; margin-top: 12px; }
.hmc .note { border-left: 3px solid var(--warn); background: color-mix(in srgb, var(--warn) 10%, transparent); padding: 8px 12px; border-radius: 0 10px 10px 0; font-size: .9rem; color: var(--ink-2); margin-top: 10px; }
.hmc .note.good { border-left-color: var(--good); background: color-mix(in srgb, var(--good) 10%, transparent); }
.hmc .note.bad { border-left-color: var(--bad); background: color-mix(in srgb, var(--bad) 10%, transparent); }
.hmc .tag { display: inline-block; font-size: .75rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; border-radius: 999px; padding: 1px 9px; border: 1px solid currentColor; }
.hmc .tag.good { color: var(--good); } .hmc .tag.warn { color: var(--warn); } .hmc .tag.bad { color: var(--bad); }
.hmc .tag.off { color: var(--ink-3); }
.hmc table.tt td .tag { word-break: normal; overflow-wrap: normal; white-space: normal; text-align: center; }
.hmc button.st { all: unset; cursor: pointer; display: inline-flex; flex-wrap: wrap; gap: 4px; border-radius: 8px; padding: 2px; }
.hmc button.st:hover .tag, .hmc button.st:focus-visible .tag { background: var(--accent-soft); }
.hmc button.st:focus-visible { outline: 2px solid var(--accent); }
.hmc tr.off td:nth-child(1), .hmc tr.off td:nth-child(2) { opacity: .5; text-decoration: line-through; text-decoration-color: var(--ink-3); }
.hmc .topbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
.hmc select.ra-lang { min-height: 34px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); font: inherit; font-size: .9rem; padding: 2px 8px; cursor: pointer; }
.hmc label.auto { display: none; margin: 0; font-weight: 500; font-size: .85rem; color: var(--ink-2); }
body.in-word .hmc label.auto { display: inline-flex; align-items: center; gap: 6px; }

.hmc table.tt { width: 100%; border-collapse: collapse; font-size: .93rem; margin-top: 8px; }
#eq table.tt { table-layout: fixed; }
.hmc table.tt th, .hmc table.tt td { text-align: left; padding: 7px 6px; border-top: 1px solid var(--line); vertical-align: top; word-break: break-word; overflow-wrap: break-word; }
.hmc table.tt th { color: var(--ink-3); font-weight: 600; font-size: .8rem; text-transform: uppercase; letter-spacing: .05em; border-top: none; }
#eq table.tt td:nth-child(1) { width: 10%; }
#eq table.tt td:nth-child(2) { width: 65%; overflow-x: auto; }
#eq table.tt td:nth-child(3) { width: 25%; }
.hmc table.tt td.r, .hmc table.tt th.r { text-align: right; }

.hmc details.cx { padding: 0; }
.hmc details summary { cursor: pointer; padding: 14px 16px; font-weight: 600; color: var(--accent); list-style: none; }
.hmc details summary::-webkit-details-marker { display: none; }
.hmc details summary::before { content: "＋ "; }
.hmc details[open] summary::before { content: "－ "; }
.hmc details .db { padding: 0 16px 16px; }
.hmc ol.work { font-size: .92rem; color: var(--ink-2); margin: 0; padding-left: 18px; }
.hmc ol.work li { margin-bottom: 6px; font-variant-numeric: tabular-nums; }

body { margin: 0; padding: 10px 12px 24px; font-family: "Segoe UI", system-ui, sans-serif; }
body.quarto-dark { background: #161412; color: #f0ece4; }
body.quarto-light { background: #f7f5f0; color: #1f1c17; }
body .hmc { max-width: 100%; margin: 6px 0 16px; }
.ra-bar { display: grid; gap: 8px; margin: 4px 0 6px; }

body.quarto-dark .ra-bar button { min-height: 40px; border-radius: 10px; border: 1px solid #3a352f; background: #1f1c19; color: #f0ece4; font: inherit; font-weight: 600; cursor: pointer; }
body.quarto-dark .ra-bar button.p { background: #d98b56; border-color: #d98b56; color: #1a1410; }
body.quarto-light .ra-bar button { min-height: 40px; border-radius: 10px; border: 1px solid #ddd6ca; background: #fffdf9; color: #1f1c17; font: inherit; font-weight: 600; cursor: pointer; }
body.quarto-light .ra-bar button.p { background: #8a4b22; border-color: #8a4b22; color: #fff; }

body.quarto-dark h1, body.quarto-dark .ra-sub, body.quarto-dark .ra-msg { color: #f0ece4; }
body.quarto-light h1, body.quarto-light .ra-sub, body.quarto-light .ra-msg { color: #1f1c17; }

.ra-foot { font-size: .75rem; color: #8a8379; } 
.ra-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 0 0 10px; }
.ra-top select.ra-lang { min-height: 32px; border-radius: 8px; font: inherit; font-size: .9rem; padding: 2px 8px; cursor: pointer; }
body.quarto-dark .ra-top select.ra-lang { border: 1px solid #3a352f; background: #2a2622; color: #f0ece4; }
body.quarto-light .ra-top select.ra-lang { border: 1px solid #ddd6ca; background: #efebe2; color: #1f1c17; }
.ra-top label.auto { display: none; margin: 0; font-size: .85rem; }
body.quarto-dark .ra-top label.auto { color: #c4bdb1; } body.quarto-light .ra-top label.auto { color: #57514a; }
body.in-word .ra-top label.auto { display: inline-flex; align-items: center; gap: 6px; }
body.quarto-dark .ra-foot a { color: #d98b56; }
body.quarto-light .ra-foot a { color: #8a4b22; }

/* ---- form engine of the checks (number fields, dropdowns, results) ---- */
.hmc .fg > div.w3 { grid-column: span 3; }
.hmc .fg > div.w2 { grid-column: span 2; }
.hmc .fg > div[hidden] { display: none; }
.hmc input[type=text], .hmc select { width: 100%; min-width: 0; max-width: 100%; min-height: 42px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); font: inherit; padding: 8px 12px; }
.hmc input.bad { border-color: var(--bad); }
.hmc .chk { display: flex; gap: 10px; align-items: flex-start; margin: 12px 0 2px; font-weight: 500; color: var(--ink); font-size: .98rem; }
.hmc .chk input { width: 22px; height: 22px; margin-top: 2px; accent-color: var(--accent); flex: none; }
.hmc .res .big { font-size: 1.7rem; font-weight: 700; line-height: 1.15; margin: 2px 0 6px; font-family: "Source Serif 4", Georgia, serif; }
.hmc .res .sub { color: var(--ink-2); margin: 0 0 10px; }
.hmc .res ul.kv { list-style: none; padding: 0; margin: 10px 0 0; }
.hmc .res ul.kv li { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-top: 1px solid var(--line); font-size: .95rem; }
.hmc .res ul.kv li span:first-child { color: var(--ink-2); }
.hmc .res ul.kv li span:last-child { font-weight: 600; text-align: right; }
.hmc .empty { color: var(--ink-3); margin: 0; }
.hmc .actions { display: grid; gap: 8px; margin-top: 14px; }
.hmc .actions button { min-height: 42px; border-radius: 12px; border: 1px solid var(--line); background: transparent; color: var(--ink); font: inherit; font-size: .92rem; cursor: pointer; }
.hmc .linkbtn { background: none; border: none; color: var(--accent); font: inherit; font-weight: 600; padding: 0; cursor: pointer; text-decoration: underline; }
.hmc .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 16px; border-radius: 999px; font-size: .9rem; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 50; }
.hmc .toast.on { opacity: 1; }
.hmc .smallprint { font-size: .8rem; color: var(--ink-3); margin-top: 14px; }
/* a value and its units stay side by side in Word's narrow pane; they stack only when very narrow */
@media (max-width: 280px) { .hmc .fg > div.w2, .hmc .fg > div.w3 { grid-column: span 6; } }
.hmc .fg { align-items: end; }   /* a value and its units line up even when one label wraps */

.hmc .res h3 { font-size: 1rem; margin: 16px 0 6px; }
.hmc .res ul.plain { margin: 6px 0 0; padding-left: 20px; color: var(--ink-2); font-size: .92rem; }
.hmc .res ul.plain li { margin-bottom: 6px; }
.hmc .res p { font-size: .93rem; }
.hmc .tt-wrap { overflow-x: auto; }
.hmc .actions button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }
.hmc .res ul.stats li span:first-child small { display: block; font-size: .78rem; color: var(--ink-3); margin-top: 1px; }
.hmc .res svg.chart { width: 100%; height: auto; display: block; margin-top: 6px; }
.hmc .res svg.chart text { fill: var(--ink-2); font-size: 11px; }
.hmc .res svg.chart .grid line { stroke: var(--line); }
.hmc .res .tt-wrap.tall { max-height: 320px; overflow: auto; }
.hmc table.tt td.diag { font-weight: 700; color: var(--good); }
.hmc table.tt td.part { font-weight: 700; color: var(--warn); }
.hmc .ev-legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: .82rem; color: var(--ink-2); margin-top: 4px; }
.hmc .ev-legend i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
/* tables in the checks (not the equation checker): keep numbers whole, scroll sideways if needed */
.hmc:not(#eq) table.tt th, .hmc:not(#eq) table.tt td { word-break: normal; overflow-wrap: normal; }
.hmc:not(#eq) table.tt td.r { white-space: nowrap; }
.hmc:not(#eq) table.tt th { white-space: normal; vertical-align: bottom; }
.hmc:not(#eq) table.tt th { font-size: .72rem; letter-spacing: .02em; }
.hmc:not(#eq) table.tt td { font-size: .88rem; padding: 6px 4px; }
.hmc:not(#eq) table.tt .tag { white-space: nowrap; font-size: .66rem; }
.hmc .chk span { font-size: .93rem; line-height: 1.35; }

/* ---- frame: title, language, list of checks, buttons ---- */
h1 { font-size: 1.25rem; margin: 2px 0 4px; }
.ra-sub { font-size: .85rem; margin: 0 0 8px; opacity: .85; }
.ra-beta { font-size: .6rem; border: 1px solid #e0a440; color: #e0a440; border-radius: 4px; padding: 1px 5px; vertical-align: middle; font-weight: 700; letter-spacing: .04em; }
body.quarto-light .ra-beta { border-color: #9a6400; color: #9a6400; }
.ra-nav { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; margin: 0 0 10px; }
.ra-nav select { width: 100%; min-width: 0; text-overflow: ellipsis; min-height: 40px; border-radius: 10px; font: inherit; font-weight: 600; padding: 4px 10px; cursor: pointer; }
.ra-links { display: flex; gap: 8px; flex-wrap: wrap; }
.ra-links button { flex: 1 1 auto; min-height: 36px; border-radius: 10px; font: inherit; font-size: .88rem; cursor: pointer; padding: 4px 10px; }
body.quarto-dark .ra-nav select, body.quarto-dark .ra-links button { border: 1px solid #3a352f; background: #2a2622; color: #f0ece4; }
body.quarto-light .ra-nav select, body.quarto-light .ra-links button { border: 1px solid #ddd6ca; background: #efebe2; color: #1f1c17; }
.ra-bar button.locked { opacity: .55; cursor: not-allowed; font-weight: 500; }
.ra-lock { font-size: .85rem; border-left: 3px solid #e0a440; padding: 6px 10px; margin: 0 0 8px; border-radius: 0 8px 8px 0; background: rgba(224,164,64,.1); }
.ra-lock a, .ra-refs a { color: inherit; font-weight: 600; }
.hmc.ra-locked .ra-lock { margin: 12px 0 0; }
.hmc.ra-locked .cx { opacity: .6; }
.hmc.ra-locked input, .hmc.ra-locked select, .hmc.ra-locked textarea, .hmc.ra-locked button { cursor: not-allowed; }
.ra-intro { font-size: .92rem; line-height: 1.45; margin: 4px 0 0; opacity: .9; }
.ra-gh { font-size: 1rem; margin: 16px 0 2px; }
.ra-gs { font-size: .85rem; margin: 0 0 8px; opacity: .75; }
.ra-card { display: block; width: 100%; text-align: left; border-radius: 12px; padding: 10px 12px; margin: 0 0 8px; font: inherit; cursor: pointer; }
.ra-card .ra-ct { display: block; font-weight: 700; margin-bottom: 2px; }
.ra-card .ra-cd { display: block; font-size: .87rem; opacity: .8; line-height: 1.35; }
body.quarto-dark .ra-card { border: 1px solid #3a352f; background: #1f1c19; color: #f0ece4; }
body.quarto-light .ra-card { border: 1px solid #ddd6ca; background: #fffdf9; color: #1f1c17; }
body.quarto-dark .ra-card:hover { border-color: #d98b56; } body.quarto-light .ra-card:hover { border-color: #8a4b22; }
.ra-refs { font-size: .8rem; margin: 0 0 14px; opacity: .85; }
.ra-refs summary { cursor: pointer; font-weight: 600; }
.ra-refs p { margin: 6px 0; }
[hidden] { display: none !important; }
.ra-docbar { margin: 0 0 8px; font-size: .82rem; }
.ra-docbar.noteq { display: none !important; }
.ra-legend { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-bottom: 6px; }
.ra-legend span { display: inline-flex; align-items: center; gap: 5px; }
.ra-legend i { display: inline-block; width: 18px; height: 4px; border-radius: 2px; }
.ra-legend .hint2 { flex-basis: 100%; opacity: .8; }
.ra-docbar button { min-height: 32px; border-radius: 8px; font: inherit; padding: 2px 10px; cursor: pointer; }
body.quarto-dark .ra-docbar button { border: 1px solid #3a352f; background: #2a2622; color: #f0ece4; }
body.quarto-light .ra-docbar button { border: 1px solid #ddd6ca; background: #efebe2; color: #1f1c17; }
#eq tbody tr { cursor: default; }
body.in-word #eq.has-places tbody tr { cursor: pointer; }
</style></head>

<body class="quarto-dark">
<h1><span id="lbl-title">Check a result</span> <span class="ra-beta">BETA</span></h1>
<p class="ra-sub" id="lbl-sub">No AI. Runs in this panel; nothing leaves your computer.</p>
<div class="ra-top" id="ra-top"></div>
<div class="ra-nav">
  <select id="ra-tool"></select>
  <div class="ra-links"><button type="button" id="ra-back">← All checks</button><button type="button" id="ra-web">Tools on the website ↗</button></div>
</div>

<div id="view-home"></div>

<div id="view-tool">
<div class="ra-bar" id="ra-bar">
  <button class="p" id="ra-sel">Check the selected equations</button>
  <button id="ra-doc">Find all equations in the document</button>
  <button id="ra-com">Add the findings as a comment</button>
</div>
<div class="ra-docbar" id="ra-docbar" hidden><div class="ra-legend" id="ra-legend"></div><button type="button" id="ra-clr">Clear the colours</button></div>
<div class="ra-lock" id="ra-lock" hidden></div>
<div class="ra-msg" id="ra-msg"></div>

<div class="ra-pane" data-pane="eq"><div class="hmc" id="eq"></div></div>
</div>

<script>
/* Form framework for the checks (from the site's shared helpers), with English, Kiswahili and
   Spanish. Everything runs in the panel. The equation checker keeps its own framework (HMEQ). */
window.HM = (function () {
  const TT = {
    en: { work: 'Show the working', example: 'Example', reset: 'Start over', check: 'Check your numbers.', press: b => `Enter the values, then press ${b}.`, stale: b => `The inputs have changed: press ${b} to update.`, copy: 'Copy', copied: 'Copied', copyThis: 'Copy this:',
          small: 'Nothing you enter leaves your computer.' },
    sw: { work: 'Onyesha hesabu', example: 'Mfano', reset: 'Anza upya', check: 'Kagua namba zako.', press: b => `Weka thamani, kisha bonyeza ${b}.`, stale: b => `Data zimebadilika: bonyeza ${b} ili kusasisha.`, copy: 'Nakili', copied: 'Imenakiliwa', copyThis: 'Nakili hiki:',
          small: 'Hakuna unachoandika kinachotoka kwenye kompyuta yako.' },
    es: { work: 'Ver el cálculo', example: 'Ejemplo', reset: 'Empezar de nuevo', check: 'Revise sus números.', press: b => `Introduzca los valores y pulse ${b}.`, stale: b => `Los datos han cambiado: pulse ${b} para actualizar.`, copy: 'Copiar', copied: 'Copiado', copyThis: 'Copie esto:',
          small: 'Nada de lo que escribe sale de su computadora.' }
  };
  let lang = 'en'; try { lang = localStorage.getItem('ra-lang') || 'en'; } catch (e) { }
  if (!TT[lang]) lang = 'en';
  const T = () => TT[lang] || TT.en;

  const UNITLESS = ['num', 'select', 'seg', 'check', 'info', 'sec', 'text', 'textarea'];
  const num = s => { s = String(s).replace(/[$,\s%]/g, ''); if (s === '') return null; return /^-?\d*\.?\d+$/.test(s) ? parseFloat(s) : NaN; };
  const fmt = (x, d = 2) => (x == null || !isFinite(x)) ? '–' : x.toLocaleString('en-US', { maximumFractionDigits: d, minimumFractionDigits: 0 });
  const fix = (x, d = 2) => (x == null || !isFinite(x)) ? '–' : x.toLocaleString('en-US', { maximumFractionDigits: d, minimumFractionDigits: d });
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  function toast(root, msg) { const t = root.querySelector('.toast'); if (!t) return; t.textContent = msg; t.classList.add('on'); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('on'), 1800); }
  function copy(root, text, msg) {
    const done = () => toast(root, msg);
    const fb = () => { const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); done(); } catch (e) { window.prompt(T().copyThis, text); } ta.remove(); };
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(done, fb); else fb();
  }

  // cfg.initial: values to start from (kept when the language changes); api.values() returns them
  function tool(cfg) {
    const root = document.getElementById(cfg.id);
    if (!root) return;
    let f = Object.assign({}, cfg.initial || {}), raw = {};
    const inputs = cfg.inputs;
    const byK = Object.fromEntries(inputs.filter(i => i.k).map(i => [i.k, i]));

    function defOf(i) { return typeof i.d === 'function' ? i.d(null, read()) : i.d; }
    function read() {
      const v = {};
      inputs.forEach(i => { if (!i.k) return; v[i.k] = f[i.k] !== undefined ? f[i.k] : defSafe(i); });
      return v;
    }
    let guard = false;
    function defSafe(i) { if (guard) return typeof i.d === 'function' ? null : i.d; guard = true; try { return defOf(i); } finally { guard = false; } }
    function shown(i) {
      if (raw[i.k] !== undefined) return raw[i.k];
      const v = f[i.k] !== undefined ? f[i.k] : defSafe(i);
      return v == null ? '' : fmt(v, 6).replace(/,/g, '');
    }
    const lab = i => typeof i.l === 'function' ? i.l() : i.l;
    function fieldHTML(i) {
      const w = i.w ? ' class="w' + i.w + '"' : '';
      const id = cfg.id + '-' + i.k;
      const hint = i.h ? `<p class="hint">${i.h}</p>` : '';
      if (i.t === 'info') return `<div${w} data-w="${i.k || ''}"><p class="hint">${i.h}</p></div>`;   // give it a k to make it conditional (show)
      if (i.t === 'select') {
        const cur = String(read()[i.k]);
        return `<div${w} data-w="${i.k}"><label for="${id}">${lab(i)}</label><select id="${id}" data-k="${i.k}">${i.opts.map(o => `<option value="${esc(o[0])}"${String(o[0]) === cur ? ' selected' : ''}>${esc(o[1])}</option>`).join('')}</select>${hint}</div>`;
      }
      if (i.t === 'seg') {
        const cur = String(read()[i.k]);
        return `<div${w} data-w="${i.k}">${i.l ? `<label>${lab(i)}</label>` : ''}<div class="seg" role="group">${i.opts.map(o => `<button type="button" data-seg="${i.k}" data-v="${esc(o[0])}" aria-pressed="${String(o[0]) === cur}">${esc(o[1])}</button>`).join('')}</div>${hint}</div>`;
      }
      if (i.t === 'textarea') { const val = read()[i.k] ?? ''; return `<div${w} data-w="${i.k}"><label for="${id}">${lab(i)}</label><textarea id="${id}" data-k="${i.k}" rows="${i.rows || 6}" spellcheck="false" placeholder="${esc(i.ph || '')}">${esc(val)}</textarea>${hint}</div>`; }
      if (i.t === 'check') return `<div${w} data-w="${i.k}"><label class="chk"><input type="checkbox" data-k="${i.k}"${read()[i.k] ? ' checked' : ''}> <span>${lab(i)}</span></label>${hint}</div>`;
      return `<div${w} data-w="${i.k}"><label for="${id}">${lab(i)}</label><input type="text" id="${id}" data-k="${i.k}" inputmode="decimal" autocomplete="off" value="${esc(shown(i))}" placeholder="${esc(i.ph || '')}">${hint}</div>`;
    }

    // cfg.button: heavy checks compute only when this button (or Example) is pressed, as on the website
    let ran = false, lastKey = null;   // cfg.live: keys whose change re-runs at once once the check has been run
    function render(force) {
      let h = '', open = false;
      inputs.forEach((i, n) => {
        if (i.t === 'sec' || n === 0) {
          if (open) h += '</div></section>';
          h += `<section class="cx"${i.t === 'sec' && i.k ? ` data-sec="${i.k}"` : ''}><div class="step">${i.t === 'sec' ? lab(i) : cfg.step}</div>${i.t === 'sec' && i.h ? `<p class="hint" style="margin-top:0">${i.h}</p>` : ''}<div class="fg">`;
          open = true;
          if (i.t === 'sec') return;
        }
        h += fieldHTML(i);
      });
      if (open) h += '</div></section>';
      const nAct = (cfg.example ? 1 : 0) + 1 + (cfg.button ? 1 : 0);
      h += `<section class="cx res" aria-live="polite"></section>
        <details class="cx hm-work"><summary>${T().work}</summary><div class="db"></div></details>
        ${cfg.after || ''}
        <div class="actions" style="grid-template-columns:repeat(${nAct},1fr)">${cfg.button ? `<button type="button" class="primary" data-act="run">${cfg.button}</button>` : ''}${cfg.example ? `<button type="button" data-act="example">${T().example}</button>` : ''}<button type="button" data-act="reset">${T().reset}</button></div>
        <p class="smallprint">${T().small}</p><div class="toast"></div>`;
      root.innerHTML = h;
      run(force);
    }

    const U = {
      n: fmt, fix,
      kv: rows => `<ul class="kv">${rows.filter(Boolean).map(r => `<li><span>${r[0]}</span><span>${r[1]}</span></li>`).join('')}</ul>`,
      note: (h, cls) => `<div class="note${cls ? ' ' + cls : ''}">${h}</div>`,
      stats: rows => `<ul class="kv stats">${rows.filter(Boolean).map(r => `<li><span>${r[0]}${r[2] ? `<small>${r[2]}</small>` : ''}</span><span>${r[1]}</span></li>`).join('')}</ul>`,
      big: (label, val, sub) => `<div class="step">${label}</div><div class="big">${val}</div>${sub ? `<p class="sub">${sub}</p>` : ''}`,
      empty: t => `<p class="empty">${t}</p>`,
      esc
    };

    function run(force) {
      const v = read();
      root.querySelectorAll('input[type=text][data-k]').forEach(inp => {
        const k = inp.dataset.k, r = raw[k];
        inp.classList.toggle('bad', r !== undefined && r.trim() !== '' && (f[k] === undefined || (typeof f[k] === 'number' && isNaN(f[k]))));
      });
      inputs.forEach(i => {
        if (!i.show) return;
        const el = root.querySelector(i.t === 'sec' ? `[data-sec="${i.k}"]` : `[data-w="${i.k}"]`);
        if (el) el.hidden = !i.show(v);
      });
      const clean = {};
      Object.keys(v).forEach(k => { const x = v[k]; clean[k] = (typeof x === 'number' && isNaN(x)) ? null : x; });
      const liveKey = ran && cfg.live && cfg.live.includes(lastKey); lastKey = null;
      if (cfg.button && !force && !liveKey) {
        const res = root.querySelector('.res');
        if (!ran) { res.innerHTML = U.empty(T().press(cfg.button)); root.querySelector('.hm-work').hidden = true; }
        else if (!res.querySelector('.stale-note')) res.insertAdjacentHTML('afterbegin', `<div class="note stale-note">${T().stale(cfg.button)}</div>`);
        return;
      }
      ran = true;
      let out;
      try { out = cfg.compute(clean, U) || {}; } catch (e) { out = { html: U.empty(T().check) }; console.warn(e); }
      if (typeof out === 'string') out = { html: out };
      root.querySelector('.res').innerHTML = out.html || '';
      const wd = root.querySelector('.hm-work');
      wd.hidden = !out.work || !out.work.length;
      wd.querySelector('.db').innerHTML = out.work && out.work.length ? `<ol class="work">${out.work.map(w => `<li>${w}</li>`).join('')}</ol>` : '';
    }

    function set(k, val) { f[k] = val; delete raw[k]; const inp = root.querySelector(`input[type=text][data-k="${k}"]`); if (inp) inp.value = shown(byK[k]); }
    const api = { set, get: k => read()[k], values: () => Object.assign({}, f), rerender: render, ran: () => ran };

    root.addEventListener('input', e => {
      const ta = e.target.closest('textarea[data-k]');
      if (ta) { f[ta.dataset.k] = ta.value; lastKey = ta.dataset.k; if (cfg.onChange) cfg.onChange(ta.dataset.k, api); run(); return; }
      const inp = e.target.closest('input[type=text][data-k]');
      if (!inp) return;
      const i = byK[inp.dataset.k];
      raw[i.k] = inp.value; lastKey = i.k;
      f[i.k] = inp.value.trim() === '' ? null : num(inp.value);
      if (cfg.onChange) cfg.onChange(i.k, api);
      run();
    });
    root.addEventListener('change', e => {
      const el = e.target;
      if (el.tagName === 'SELECT' && el.dataset.k) { f[el.dataset.k] = el.value; lastKey = el.dataset.k; if (cfg.onChange) cfg.onChange(el.dataset.k, api); run(); }
      else if (el.type === 'checkbox' && el.dataset.k) { f[el.dataset.k] = el.checked; if (cfg.onChange) cfg.onChange(el.dataset.k, api); run(); }
    });
    root.addEventListener('click', e => {
      const b = e.target.closest('button');
      if (!b) return;
      if (b.dataset.seg) {
        f[b.dataset.seg] = b.dataset.v; lastKey = b.dataset.seg;
        b.parentElement.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
        if (cfg.onChange) cfg.onChange(b.dataset.seg, api);
        run(); return;
      }
      const a = b.dataset.act;
      if (a === 'reset') { f = {}; raw = {}; ran = false; render(); }
      else if (a === 'example' && cfg.example) { f = Object.assign({}, typeof cfg.example === 'function' ? cfg.example(read()) : cfg.example); raw = {}; render(true); }
      else if (a === 'run') run(true);
      else if (a === 'say') { const s = root.querySelector('.hm-say'); if (s) copy(root, s.textContent, T().copied); }
    });
    render(!!cfg.initialRun);
    return api;
  }

  return { tool, fmt, fix, num, esc, get lang() { return lang; }, setLang(l) { if (TT[l]) lang = l; } };
})();

</script>
<script>
/* The checks offered in the add-in (free tier: values typed or pasted in). Each check has its text in
   English (en), Kiswahili (sw) and Spanish (es), and build(L) returns the form for language L.
   The calculations are the same as on rafikiardhi.earth/checks.html. */
window.RA_CHECKS = (function () {
  const F = (x, d) => HM.fmt(x, d);
  const pick = (o, L) => o[L] || o.en;

  // ---------------------------------------------------------------- Back-transformation
  const BT = {
    en: {
      step: 'Log-scale results', base: 'Logarithm', ln: 'Natural (ln)', l10: 'Base 10', mu: 'Mean of the log values', sd: 'SD of the log values',
      sdh: 'For a kriged estimate, use the square root of the kriging variance.', c: 'Constant added before logging, if log(x + c)', rep: 'Value reported in original units (optional)',
      empty: 'Enter the mean and SD of the log values.', med: 'Median (geometric mean)', mean: 'Mean (arithmetic, lognormal)', ratio: 'Mean ÷ median', range: 'Range holding 95% of values',
      isMed: (r, m, p) => `<b>The reported ${r} is the median, not the mean.</b> The arithmetic mean is about ${m}, ${p}% higher. That matters for totals, stocks and loads, which add up means.`,
      isMean: r => `<b>The reported ${r} is the bias-corrected mean.</b> Correctly back-transformed.`,
      other: (r, o, w, t) => `<b>The reported ${r} matches ${o} logs</b> (${w}), not ${t} logs. Check which logarithm was used.`,
      nat: 'natural', b10: 'base-10', wMed: 'median', wMean: 'mean',
      neither: (r, a, b) => `The reported ${r} matches neither the median (${a}) nor the mean (${b}). Check the logarithm base, any constant added before logging, and whether the SD is of the logs or of the original values.`,
      wMedL: 'Median', wMeanL: 'Mean', wConv: '(σ is converted to natural-log units first: σ × ln 10)',
      wAssume: 'This assumes the log values are roughly normal. For lognormal kriging, the variogram tool applies the full correction, including the Lagrange term.'
    },
    sw: {
      step: 'Matokeo ya kipimo cha logariti', base: 'Logariti', ln: 'Asilia (ln)', l10: 'Msingi 10', mu: 'Wastani wa thamani za logariti', sd: 'Mkengeuko sanifu (SD) wa thamani za logariti',
      sdh: 'Kwa makadirio ya kriging, tumia kipeuo cha pili (square root) cha tofauti ya kriging (kriging variance).', c: 'Kiasi kilichoongezwa kabla ya logariti, kama log(x + c)', rep: 'Thamani iliyoripotiwa katika vipimo asilia (si lazima)',
      empty: 'Weka wastani na SD wa thamani za logariti.', med: 'Wastani wa kati (median; wastani wa kijiometri)', mean: 'Wastani (wa kawaida, lognormal)', ratio: 'Wastani ÷ wastani wa kati', range: 'Kiwango kinachobeba 95% ya thamani',
      isMed: (r, m, p) => `<b>Thamani iliyoripotiwa ${r} ni wastani wa kati (median), si wastani (mean).</b> Wastani wa kawaida ni takriban ${m}, juu kwa ${p}%. Hili ni muhimu kwa jumla, akiba (stocks) na mizigo (loads), ambazo hujumlisha wastani.`,
      isMean: r => `<b>Thamani iliyoripotiwa ${r} ni wastani uliorekebishwa kwa upendeleo (bias-corrected mean).</b> Imerejeshwa ipasavyo.`,
      other: (r, o, w, t) => `<b>Thamani iliyoripotiwa ${r} inalingana na logariti za ${o}</b> (${w}), si logariti za ${t}. Kagua logariti ipi ilitumika.`,
      nat: 'asilia', b10: 'msingi 10', wMed: 'wastani wa kati', wMean: 'wastani',
      neither: (r, a, b) => `Thamani iliyoripotiwa ${r} hailingani na wastani wa kati (${a}) wala wastani (${b}). Kagua msingi wa logariti, kiasi chochote kilichoongezwa kabla ya logariti, na kama SD ni ya logariti au ya thamani asilia.`,
      wMedL: 'Wastani wa kati', wMeanL: 'Wastani', wConv: '(σ hubadilishwa kwanza kuwa vipimo vya logariti asilia: σ × ln 10)',
      wAssume: 'Hii inachukulia kuwa thamani za logariti zinakaribia mgawanyo wa kawaida (normal). Kwa kriging ya lognormal, zana ya variogram hutumia marekebisho kamili, ikiwemo kipengele cha Lagrange.'
    },
    es: {
      step: 'Resultados en escala logarítmica', base: 'Logaritmo', ln: 'Natural (ln)', l10: 'Base 10', mu: 'Media de los valores logarítmicos', sd: 'DE de los valores logarítmicos',
      sdh: 'Para una estimación por kriging, use la raíz cuadrada de la varianza de kriging.', c: 'Constante sumada antes del logaritmo, si log(x + c)', rep: 'Valor informado en unidades originales (opcional)',
      empty: 'Introduzca la media y la DE de los valores logarítmicos.', med: 'Mediana (media geométrica)', mean: 'Media (aritmética, lognormal)', ratio: 'Media ÷ mediana', range: 'Rango que contiene el 95 % de los valores',
      isMed: (r, m, p) => `<b>El valor informado ${r} es la mediana, no la media.</b> La media aritmética es de aproximadamente ${m}, un ${p} % mayor. Esto importa para totales, reservas y cargas, que suman medias.`,
      isMean: r => `<b>El valor informado ${r} es la media corregida por sesgo.</b> Retransformado correctamente.`,
      other: (r, o, w, t) => `<b>El valor informado ${r} coincide con logaritmos ${o}</b> (${w}), no con logaritmos ${t}. Verifique qué logaritmo se usó.`,
      nat: 'naturales', b10: 'en base 10', wMed: 'mediana', wMean: 'media',
      neither: (r, a, b) => `El valor informado ${r} no coincide ni con la mediana (${a}) ni con la media (${b}). Verifique la base del logaritmo, cualquier constante sumada antes del logaritmo y si la DE es de los logaritmos o de los valores originales.`,
      wMedL: 'Mediana', wMeanL: 'Media', wConv: '(σ se convierte primero a unidades de logaritmo natural: σ × ln 10)',
      wAssume: 'Esto supone que los valores logarítmicos son aproximadamente normales. Para el kriging lognormal, la herramienta de variograma aplica la corrección completa, incluido el término de Lagrange.'
    }
  };
  function buildBT(L) {
    const S = pick(BT, L);
    return {
      step: S.step,
      example: { base: 'ln', c: 0, mu: 0.4, sd: 0.65, rep: 1.49 },
      inputs: [
        { k: 'base', l: S.base, t: 'seg', d: 'ln', opts: [['ln', S.ln], ['log10', S.l10]] },
        { k: 'mu', l: S.mu, t: 'num', w: 3 },
        { k: 'sd', l: S.sd, t: 'num', w: 3, h: S.sdh },
        { k: 'c', l: S.c, t: 'num', d: 0, w: 3 },
        { k: 'rep', l: S.rep, t: 'num', w: 3 }
      ],
      compute(v, U) {
        if (v.mu == null || !(v.sd >= 0)) return U.empty(S.empty);
        const est = (base, mu, sd) => { const k = base === 'ln' ? 1 : Math.LN10; return { med: Math.exp(k * mu) - (v.c || 0), mean: Math.exp(k * mu + (k * sd) ** 2 / 2) - (v.c || 0), lo: Math.exp(k * (mu - 1.96 * sd)) - (v.c || 0), hi: Math.exp(k * (mu + 1.96 * sd)) - (v.c || 0) }; };
        const e = est(v.base, v.mu, v.sd), d = Math.abs(e.mean) < 10 ? 3 : 2;
        let h = U.kv([[S.med, F(e.med, d)], [S.mean, F(e.mean, d)], [S.ratio, F(e.mean / e.med, 3)], [S.range, `${F(e.lo, d)} – ${F(e.hi, d)}`]]);
        if (v.rep > 0) {
          const near = (a, b) => Math.abs(a - b) / Math.abs(b) < 0.03;
          if (near(v.rep, e.med)) h = U.note(S.isMed(v.rep, F(e.mean, d), F((e.mean / e.med - 1) * 100, 0)), 'bad') + h;
          else if (near(v.rep, e.mean)) h = U.note(S.isMean(v.rep), 'good') + h;
          else {
            const alt = est(v.base === 'ln' ? 'log10' : 'ln', v.mu, v.sd);
            if (near(v.rep, alt.med) || near(v.rep, alt.mean)) h = U.note(S.other(v.rep, v.base === 'ln' ? S.b10 : S.nat, near(v.rep, alt.med) ? S.wMed : S.wMean, v.base === 'ln' ? S.nat : S.b10), 'bad') + h;
            else h = U.note(S.neither(v.rep, F(e.med, d), F(e.mean, d))) + h;
          }
        }
        const k = v.base === 'ln' ? 'e' : '10', kk = v.base === 'ln' ? '' : ' × ln 10';
        return { html: h, work: [`${S.wMedL} = ${k}^μ${v.c ? ' − c' : ''} = ${F(e.med, d + 1)}`, `${S.wMeanL} = ${k}^(μ + σ²${kk ? '·ln10' : ''}/2)${v.c ? ' − c' : ''} = ${F(e.mean, d + 1)}${v.base === 'log10' ? ' ' + S.wConv : ''}`, S.wAssume] };
      }
    };
  }

  // ---------------------------------------------------------------- Carbon stock arithmetic
  const RHO_G = 2.65; // particle density of coarse fragments, g/cm³
  function stock(p) { // returns Mg C/ha
    const C = p.cunit === 'pct' ? p.c * 10 : p.cunit === 'mgkg' ? p.c / 1000 : p.c;           // g/kg
    const bd = p.bdunit === 'kgm3' ? p.bd / 1000 : p.bd;                                         // g/cm³
    const dep = p.dunit === 'm' ? p.dep * 100 : p.dunit === 'mm' ? p.dep / 10 : p.dep;           // cm
    const cf = (p.cf || 0) / 100;
    let mfe; // g of fine earth per cm³ of whole soil
    if (p.bdbasis === 'whole') mfe = p.cfbasis === 'mass' ? bd * (1 - cf) : bd - cf * RHO_G;
    else { const cfv = p.cfbasis === 'vol' ? cf : (cf / RHO_G) / (cf / RHO_G + (1 - cf) / bd); mfe = bd * (1 - cfv); }
    return { s: C * mfe * dep * 0.1, C, bd, dep, mfe };
  }
  const SA = {
    en: {
      step: 'Inputs as reported', c: 'Organic carbon', units: 'Units', bd: 'Bulk density', bdbasis: 'Bulk density is of', fine: 'Fine earth only (stones removed, volume corrected)', whole: 'Whole soil, stones included',
      dep: 'Layer thickness', cf: 'Coarse fragments (stones, gravel), % of the soil', cfh: '', cfbasis: 'Fragments measured by', vol: 'Volume', mass: 'Mass', sec: 'Reported stock (optional)', rep: 'Stock',
      empty: 'Enter carbon, bulk density, thickness and coarse fragments.', big: 'Recalculated stock',
      w1: (c, b, d) => `Carbon = ${c} g/kg; bulk density = ${b} g/cm³; thickness = ${d} cm`,
      w2: (m, basis, by, conv) => `Fine earth per volume of soil = ${m} g/cm³ (${basis}, fragments by ${by}${conv ? `, converted using a stone density of ${RHO_G} g/cm³` : ''})`,
      bWhole: 'whole-soil bulk density', bFine: 'fine-earth bulk density', byVol: 'volume', byMass: 'mass',
      w3: s => `Stock = C (g/kg) × fine earth (g/cm³) × thickness (cm) × 0.1 = ${s} Mg C/ha`,
      match: r => `<b>Matches.</b> The reported stock (${r} Mg C/ha) follows from the inputs.`,
      tries: ['% read as g/kg (carbon 10× too low)', 'Stones ignored', 'Stone fraction on the wrong basis (volume vs. mass)', 'Bulk density on the wrong basis (fine earth vs. whole soil)', 'Stones subtracted twice (fine-earth bulk density and a volume correction)', 'Organic matter used instead of carbon (× 1.724)', 'Thickness in mm read as cm, or cm as mm'],
      gives: 'gives', lowLab: 'The stock is in kg C/m² but labelled Mg C/ha (10× too low)', highLab: 'The stock is 10× too high: kg C/m² and Mg C/ha mixed up',
      off: (p, hits) => `<b>Doesn't match (${p}% off).</b> This slip reproduces the reported value:<br>• ${hits}`,
      none: p => `<b>Doesn't match (${p}% off),</b> and none of the common slips explains it. Check whether the stock is for a different depth, an equivalent soil mass basis, or a sum of several layers.`
    },
    sw: {
      step: 'Data kama zilivyoripotiwa', c: 'Kaboni hai (organic carbon)', units: 'Vipimo', bd: 'Msongamano wa udongo (bulk density)', bdbasis: 'Msongamano ni wa', fine: 'Udongo laini pekee (mawe yameondolewa, ujazo umerekebishwa)', whole: 'Udongo wote, pamoja na mawe',
      dep: 'Unene wa tabaka', cf: 'Vipande vikubwa (mawe, changarawe), % ya udongo', cfh: '', cfbasis: 'Vipande vimepimwa kwa', vol: 'Ujazo', mass: 'Uzito', sec: 'Akiba iliyoripotiwa (si lazima)', rep: 'Akiba',
      empty: 'Weka kaboni, msongamano, unene na vipande vikubwa.', big: 'Akiba iliyokokotolewa upya',
      w1: (c, b, d) => `Kaboni = ${c} g/kg; msongamano = ${b} g/cm³; unene = ${d} cm`,
      w2: (m, basis, by, conv) => `Udongo laini kwa kila ujazo wa udongo = ${m} g/cm³ (${basis}, vipande kwa ${by}${conv ? `, imebadilishwa kwa kutumia msongamano wa mawe wa ${RHO_G} g/cm³` : ''})`,
      bWhole: 'msongamano wa udongo wote', bFine: 'msongamano wa udongo laini', byVol: 'ujazo', byMass: 'uzito',
      w3: s => `Akiba = C (g/kg) × udongo laini (g/cm³) × unene (cm) × 0.1 = ${s} Mg C/ha`,
      match: r => `<b>Inalingana.</b> Akiba iliyoripotiwa (${r} Mg C/ha) inatokana na data zilizotolewa.`,
      tries: ['% imesomwa kama g/kg (kaboni chini mara 10)', 'Mawe yamepuuzwa', 'Sehemu ya mawe kwa msingi usio sahihi (ujazo dhidi ya uzito)', 'Msongamano kwa msingi usio sahihi (udongo laini dhidi ya udongo wote)', 'Mawe yametolewa mara mbili (msongamano wa udongo laini na marekebisho ya ujazo)', 'Viumbehai (organic matter) vimetumika badala ya kaboni (× 1.724)', 'Unene wa mm umesomwa kama cm, au cm kama mm'],
      gives: 'inatoa', lowLab: 'Akiba iko katika kg C/m² lakini imeandikwa Mg C/ha (chini mara 10)', highLab: 'Akiba iko juu mara 10: kg C/m² na Mg C/ha zimechanganywa',
      off: (p, hits) => `<b>Hailingani (tofauti ya ${p}%).</b> Kosa hili linazalisha thamani iliyoripotiwa:<br>• ${hits}`,
      none: p => `<b>Hailingani (tofauti ya ${p}%),</b> na hakuna kosa la kawaida linaloeleza. Kagua kama akiba ni ya kina tofauti, ya msingi wa uzito sawa wa udongo (equivalent soil mass), au jumla ya tabaka kadhaa.`
    },
    es: {
      step: 'Datos tal como se informaron', c: 'Carbono orgánico', units: 'Unidades', bd: 'Densidad aparente', bdbasis: 'La densidad aparente es de', fine: 'Solo tierra fina (sin piedras, volumen corregido)', whole: 'Suelo completo, con piedras',
      dep: 'Espesor de la capa', cf: 'Fragmentos gruesos (piedras, grava), % del suelo', cfh: '', cfbasis: 'Fragmentos medidos por', vol: 'Volumen', mass: 'Masa', sec: 'Reserva informada (opcional)', rep: 'Reserva',
      empty: 'Introduzca el carbono, la densidad aparente, el espesor y los fragmentos gruesos.', big: 'Reserva recalculada',
      w1: (c, b, d) => `Carbono = ${c} g/kg; densidad aparente = ${b} g/cm³; espesor = ${d} cm`,
      w2: (m, basis, by, conv) => `Tierra fina por volumen de suelo = ${m} g/cm³ (${basis}, fragmentos por ${by}${conv ? `, convertido usando una densidad de piedra de ${RHO_G} g/cm³` : ''})`,
      bWhole: 'densidad aparente del suelo completo', bFine: 'densidad aparente de la tierra fina', byVol: 'volumen', byMass: 'masa',
      w3: s => `Reserva = C (g/kg) × tierra fina (g/cm³) × espesor (cm) × 0.1 = ${s} Mg C/ha`,
      match: r => `<b>Coincide.</b> La reserva informada (${r} Mg C/ha) se deriva de los datos.`,

        for (let i = 0; i < pts.length; i++) for (let j = i + 1; j < pts.length; j++) { const d = hav(pts[i], pts[j]); if (d > maxd) { maxd = d; pair = [i, j]; } }
        const naive = Math.hypot(pts[pair[0]][0] - pts[pair[1]][0], pts[pair[0]][1] - pts[pair[1]][1]) * 111.195;
        return { html: U.note(S.geo(F(lat0, 2))) +
          U.kv([[S.maxd, `${F(maxd, 3)} km`], [S.flat, `${F(naive, 3)} km`], [S.stretch, `${F(1 / c, 2)}×`]]) +
          (Math.abs(1 / c - 1) > 0.05 ? U.note(S.bad(F(1 / c, 2)), 'bad') : ''),
          work: [S.wHav, `cos(${F(lat0, 2)}°) = ${F(c, 3)}`] };
      }
    };

        grpAdj: ['Data za makundi au zinazorudiwa: kagua marekebisho yaliyotajwa', 'Ulitumia mbinu inayozingatia mpango. Hakikisha inalingana na muundo wa makundi na kinachokadiriwa; mixed model au kosa sanifu thabiti haitatui kila tatizo la utegemezi moja kwa moja.'],
        grp: ['Vipimo vya makundi au vinavyorudiwa vinaweza kutegemeana', 'Kagua kama hitimisho linazingatia muundo wa makundi au vipimo vinavyorudiwa. Njia zinazowezekana ni pamoja na muhtasari wa ngazi ya kundi, mixed-effects models, GEE, kutokuwa na uhakika kulikoimarishwa kwa makundi, au uchambuzi maalum wa vipimo vinavyorudiwa. Chaguo sahihi linategemea swali na mpango.'],

        spNew: ['Uthibitishaji unaweza usilingane na utabiri kwa maeneo mapya', 'Kwa dai kuhusu maeneo au kanda mpya, makundi ya nasibu yanaweza kuweka vipimo vilivyo karibu katika seti za mafunzo na majaribio. Fikiria vitalu vya kijiografia, kinga (buffers), uthibitishaji unaolinganisha umbali, au seti huru ya data ya eneo linalolengwa.'],
        sp: ['Kagua utegemezi wa kijiografia dhidi ya lengo la uchambuzi', 'Uhusiano wa kijiografia (spatial autocorrelation) wenyewe haufanyi uchambuzi kuwa batili. Kagua kama utegemezi wa mabaki unaathiri makosa sanifu au kama umbali wa uthibitishaji unawakilisha mahali ambapo utabiri utatumika.'],

        leak: ['Huenda kuna uvujaji wa taarifa (leakage)', 'Uandaaji wote wa data unaotegemea data, uchaguzi wa vigeu, ujazaji wa data zinazokosekana, kusawazisha vipimo na urekebishaji vinapaswa kufanywa kwa data za mafunzo pekee ndani ya kila mgawanyo. Vigeu-saidizi vinavyotokana na kinacholengwa vinahitaji uchunguzi maalum.'],
        rndNew: ['Uthibitishaji wa nasibu unaweza kujibu swali lisilo sahihi', 'Uthibitishaji wa nasibu unakadiria utendaji kwa data zinazofanana na seti ya sampuli, mara nyingi makundi yaleyale yakiwa katika seti zote mbili. Hauthibitishi utendaji katika maeneo, wahusika au kanda mpya kabisa.'],
        rndFut: ['Uthibitishaji wa nasibu kwa kawaida haufai kwa utabiri wa baadaye', 'Mgawanyo wa nasibu unaweza kuchanganya taarifa za zamani na za baadaye. Pendelea mgawanyo unaofuata mpangilio wa muda au tathmini ya mwanzo-unaosogea (rolling-origin) inayoiga kazi halisi ya utabiri.'],

        grpAdj: ['Datos agrupados o repetidos: compruebe el ajuste indicado', 'Usó un método que tiene en cuenta el diseño. Confirme que corresponde a la estructura de agrupación y al estimando; un modelo mixto o un error estándar robusto no resuelve automáticamente todo problema de dependencia.'],
        grp: ['Las observaciones agrupadas o repetidas pueden ser dependientes', 'Compruebe si la inferencia tiene en cuenta la estructura de grupos o de medidas repetidas. Posibles enfoques: resúmenes a nivel de grupo, modelos de efectos mixtos, GEE, incertidumbre robusta por conglomerado o un análisis de medidas repetidas específico del diseño. La opción adecuada depende de la pregunta y del diseño.'],
        pseudo: ['Posible pseudorreplicación', 'Compruebe si el tratamiento o el muestreo se replicó de forma independiente al nivel indicado. Las submuestras y las réplicas técnicas pueden mejorar la precisión de la medición, pero no crean unidades experimentales independientes adicionales.'],
        spNew: ['La validación puede no corresponder a la predicción en lugares nuevos', 'Para una afirmación sobre sitios o regiones nuevos, los pliegues aleatorios pueden poner observaciones cercanas en los conjuntos de entrenamiento y de prueba. Considere bloques espaciales, zonas de exclusión, validación ajustada por distancia o un conjunto independiente del área objetivo.'],
        sp: ['Compruebe la dependencia espacial frente al objetivo del análisis', 'La autocorrelación espacial no invalida por sí misma un análisis. Compruebe si la dependencia de los residuos afecta a los errores estándar o si las distancias de validación representan los lugares donde se usarán las predicciones.'],
        tFut: ['La validación puede usar información del futuro', 'En pronósticos, las divisiones aleatorias pueden permitir que observaciones futuras informen las predicciones de periodos anteriores. Use una evaluación ordenada en el tiempo, idealmente conservando el horizonte de pronóstico y cualquier agrupación temporal.'],
        t: ['Compruebe la dependencia temporal y el orden', 'Los momentos contiguos o las mediciones repetidas pueden estar correlacionados. Confirme que el modelo de incertidumbre tiene en cuenta la dependencia y que la validación conserva la dirección temporal prevista.'],

      h1: 'Introduzca el variograma tal como se informó: como razón pepita : meseta, como pepita y meseta, o como pepita y meseta parcial (la meseta menos la pepita; gstat la informa como psill, y muchos artículos también). La meseta es el total: pepita + meseta parcial. Aquí solo importa la razón, así que cualquiera de las tres da la misma respuesta.',
      h2: 'El error del mapa es la raíz del error medio de kriging en lugares no muestreados, como fracción de la desviación estándar de la propiedad. 100% significa no mejor que la media; la pepita fija el error mínimo que puede alcanzar cualquier densidad.',

  function buildSV(L) {
    const S = pick(SV, L), V = pick(VGT, L);
    return {
      step: S.step, button: S.btn,
      example: { model: 'sph', vform: 'ratio', ratio: 0.2, r: 250, area: 50, target: 60 },
      inputs: [
        ...vgInputs(V, 0.2),
        { k: 'r', l: V.r, t: 'num', d: 250, w: 3 }, { k: 'area', l: V.area, t: 'num', d: 50, w: 3 },
        { k: 'target', l: S.target, t: 'num', d: 60 },
        { t: 'info', h: S.h1 }, { t: 'info', h: S.h2 }
      ],
      compute(v, U) {
        const VV = vgRead(v, V), r = N(v.r), ha = N(v.area), tgt = N(v.target) / 100;
        if (VV.err) return U.note(VV.err, 'bad');
        if (!(VV.ratio < 1) || !(r > 0) || !(ha > 0) || !(tgt > 0 && tgt <= 1)) return !(VV.ratio < 1) ? U.note(S.noStruct, 'bad') : U.empty(S.enter);
        const m = { type: v.model, c0: VV.ratio, c1: 1 - VV.ratio, r }, floor = Math.sqrt(m.c0);
        const err = n => krExpected(m, n, ha, true, 1, 'map').mid;
        const rows = [], cand = [9, 16, 25, 36, 49, 64, 100, 144, 225, 400, 625, 900, 1600, 2500, 4900, 10000];
        let need = null;
        for (const n of cand) { const e = err(n), sp = Math.sqrt(ha * 10000 / n); rows.push([n, fx(sp, 0), fx(sp / r, 2), fx(e * 100, 0) + '%']); if (need == null && e <= tgt) need = n; }
        if (need != null) { let lo = cand[Math.max(0, cand.indexOf(need) - 1)], hi = need; if (lo !== hi) { while (hi - lo > Math.max(1, lo * 0.02)) { const mid = Math.round((lo + hi) / 2); if (err(mid) <= tgt) hi = mid; else lo = mid; } need = hi; } }
        const sp = need ? Math.sqrt(ha * 10000 / need) : null;
        const msg = tgt <= floor ? S.below(fx(floor * 100, 0)) : (need ? '' : S.never);
        let h = msg ? U.note(msg, 'bad') : '';
        h += U.stats([
          need ? [S.need, need, S.perHa(fx(need / ha, need / ha < 1 ? 2 : 1))] : [S.need, '–', S.notReach],
          need ? [S.gsp, fx(sp, 0) + ' m', S.xr(fx(sp / r, 2))] : null,
          [S.lowest, fx(floor * 100, 0) + '%', S.nugShare]
        ]);
        h += `<div class="tt-wrap"><table class="tt"><thead><tr>${S.th.map((t, i) => `<th${i ? ' class="r"' : ''}>${t}</th>`).join('')}</tr></thead><tbody>` +
          rows.map(r => `<tr>${r.map((c, i) => `<td${i ? ' class="r"' : ''}>${c}</td>`).join('')}</tr>`).join('') + '</tbody></table></div>';
        return { html: h + exportBtn(), work: [S.why] };
      }
    };
  }

  // ---------------------------------------------------------------- Detectable change in carbon
  const CM = {
    en: {
      step: 'Sampling design', cv: 'Variability, CV of stocks (%)', n: 'Samples per sampling time', des: 'Design', ind: 'Different locations each time', pair: 'Same locations resampled',

      why: (a, p, pair, rho) => `Cambio mínimo detectable = (t para ${a}% de confianza + t para ${p}% de potencia) × CV × √(2(1 − ρ) ÷ n)${pair ? `, con ρ = ${rho} para lugares remuestreados` : ''}. Supone que el cambio se expresa respecto al stock medio, y no incluye errores de densidad aparente ni de profundidad, que hacen menos sensibles los diseños reales.`

  function buildCM(L) {
    const S = pick(CM, L);
    return {
      step: S.step,
      inputs: [
        { k: 'cv', l: S.cv, t: 'num', d: 30, w: 3 }, { k: 'n', l: S.n, t: 'num', d: 20, w: 3 },
        { k: 'des', l: S.des, t: 'select', d: 'ind', opts: [['ind', S.ind], ['pair', S.pair]] },
        { k: 'rho', l: S.rho, t: 'num', d: 0.6, show: v => v.des === 'pair' },
        { k: 'alpha', l: S.alpha, t: 'select', d: '0.05', w: 3, opts: [['0.1', '0.10'], ['0.05', '0.05'], ['0.01', '0.01']] },
        { k: 'pow', l: S.pow, t: 'select', d: '0.8', w: 3, opts: [['0.8', '80%'], ['0.9', '90%']] },
        { k: 'claim', l: S.claim, t: 'num' },
        { t: 'info', h: S.hint }
      ],
      compute(v, U) {
        const cv = N(v.cv), n = Math.round(N(v.n)), pair = v.des === 'pair', rho = pair ? N(v.rho) : 0;
        const alpha = Number(v.alpha), pow = Number(v.pow), claim = N(v.claim);
        if (!(cv > 0) || !(n >= 2) || !(rho >= 0 && rho < 1)) return U.empty(S.empty);
        const mdd = nn => { const df = pair ? nn - 1 : 2 * nn - 2; return (tinv(1 - alpha / 2, Math.max(1, df)) + tinv(pow, Math.max(1, df))) * cv * Math.sqrt(2 * (1 - rho) / nn); };
        const nFor = target => { for (let nn = 2; nn <= 100000; nn = nn < 50 ? nn + 1 : Math.ceil(nn * 1.05)) if (mdd(nn) <= target) { let lo = Math.max(2, Math.floor(nn / 1.05)), hi = nn; while (lo < hi) { const mid = Math.floor((lo + hi) / 2); if (mdd(mid) <= target) hi = mid; else lo = mid + 1; } return lo; } return null; };
        const m = mdd(n);
        const rows = [[S.mdd, '±' + fx(m, 1) + '%', S.withN(n)], [S.for10, nFor(10) ?? S.many, S.per], [S.for5, nFor(5) ?? S.many, S.per]];
        let vh = '';
        if (claim > 0) {
          const need = nFor(claim);
          rows.push([S.forX(claim), need ?? S.many, S.per]);
          vh = claim >= m ? verdict('good', S.yes, S.yesB(claim, fx(m, 1))) : verdict('bad', S.no, S.noB(claim, fx(m, 1), need, pair));
        }
        return { html: U.stats(rows) + vh + exportBtn(), work: [S.why(Math.round((1 - alpha) * 100), Math.round(pow * 100), pair, rho)] };
      }
    };

  function buildEC(L) {
    const S = pick(EC, L);
    return {
      step: S.step,
      example: { r2: 0.85, rmse: 0.25, sd: 0.9, n: 40, lab: 0.15 },
      inputs: [
        { k: 'r2', l: S.r2, t: 'num', w: 3 }, { k: 'rmse', l: S.rmse, t: 'num', w: 3 },
        { k: 'sd', l: S.sd, t: 'num', w: 3 }, { k: 'n', l: S.n, t: 'num', w: 3 },
        { k: 'lab', l: S.lab, t: 'num' }, { t: 'info', h: S.hint }
      ],
      compute(v, U) {
        const r2 = N(v.r2), rmse = N(v.rmse), sd = N(v.sd), n = Math.round(N(v.n)), lab = N(v.lab);
        if (!(r2 >= 0 && r2 <= 1) || !(rmse > 0) || !(sd > 0)) return U.empty(S.empty);
        const floor = sd * Math.sqrt(1 - r2), ratio = rmse / floor, d = sd < 10 ? 3 : 2;
        const st = [[S.floor, fx(floor, d), S.floorU], [S.ratio, fx(ratio, 2), S.ratioU]], vv = [];
        if (rmse < floor * 0.97) vv.push(verdict('bad', S.cant, S.cantB(r2, sd, fx(floor, d), rmse)));
        else if (ratio > 1.5) vv.push(verdict('warn', S.flat, S.flatB(fx(ratio, 1))));
        else vv.push(verdict('good', S.cons, S.consB));
        if (lab > 0) {
          const ceil = Math.max(0, 1 - (lab * lab) / (sd * sd));
          st.push([S.ceil, fx(ceil, 3), S.ceilU], [S.lowR, fx(lab, d), S.lowRU]);
          if (r2 > ceil + 0.01 || rmse < lab * 0.95) vv.push(verdict('bad', S.better, S.betterB(lab, fx(ceil, 2))));
        }
        if (n >= 4 && r2 > 0 && r2 < 1) {
          const r = Math.sqrt(r2), z = Math.atanh(r), se = 1 / Math.sqrt(n - 3), lo = Math.tanh(z - 1.96 * se), hi = Math.tanh(z + 1.96 * se);
          st.push([S.r2i, `${fx(Math.max(0, lo) ** 2, 2)}–${fx(hi ** 2, 2)}`, S.from(n)], [S.rmsei, `${fx(rmse * Math.sqrt(n / (n + 1.96 * Math.sqrt(2 * n))), d)}–${fx(rmse * Math.sqrt(n / Math.max(1, n - 1.96 * Math.sqrt(2 * n))), d)}`, S.approx]);
          if (n < 30) vv.push(verdict('warn', S.small, S.smallB(n)));
        }
        return { html: U.stats(st) + vv.join('') + exportBtn(), work: [S.why] };
      }
    };
  }

  // ---------------------------------------------------------------- Classification accuracy

  function buildCC(L) {
    const S = pick(CC, L);
    return {
      step: S.step,
      example: { acc: 72, n: 45, k: 6, maj: 48, acc2: 64, n2: 45 },
      inputs: [
        { k: 'acc', l: S.acc, t: 'num', w: 3 }, { k: 'n', l: S.n, t: 'num', w: 3 },
        { k: 'k', l: S.k, t: 'num', w: 3 }, { k: 'maj', l: S.maj, t: 'num', w: 3 },
        { k: 'acc2', l: S.acc2, t: 'num', w: 3 }, { k: 'n2', l: S.n2, t: 'num', w: 3 },
        { t: 'info', h: S.hint }
      ],
      compute(v, U) {
        const a = N(v.acc) / 100, n = Math.round(N(v.n)), k = Math.round(N(v.k)), maj = N(v.maj) / 100;
        const a2 = N(v.acc2) / 100, n2 = Math.round(N(v.n2));
        if (!(a >= 0 && a <= 1) || !(n >= 5) || !(k >= 2)) return U.empty(S.empty);
        const wilson = (p, m) => { const z = 1.96, den = 1 + z * z / m, c = (p + z * z / (2 * m)) / den, h = z * Math.sqrt(p * (1 - p) / m + z * z / (4 * m * m)) / den; return [Math.max(0, c - h), Math.min(1, c + h)]; };
        const [lo, hi] = wilson(a, n), base = maj > 0 ? maj : 1 / k;
        const z = (a - base) / Math.sqrt(base * (1 - base) / n), pBase = 1 - 0.5 * (1 + erf(z / Math.SQRT2));
        const kappaLike = (a - base) / (1 - base);
        const nNeed = Math.ceil(1.96 * 1.96 * a * (1 - a) / 0.0025);
        const st = [[S.ci, `${fx(lo * 100, 0)}–${fx(hi * 100, 0)}%`, S.from(n)], [S.base, fx(base * 100, 0) + '%', maj > 0 ? S.largest : S.even(k)],
          [S.skill, fx(kappaLike * 100, 0) + '%', S.skillU], [S.pts, nNeed, S.ptsU]], vv = [];
        if (lo <= base) vv.push(verdict('bad', S.guess, S.guessB(fx(lo * 100, 0), fx(hi * 100, 0), fx(base * 100, 0), maj > 0)));
        else vv.push(verdict('good', S.beats, S.beatsB(fx(lo * 100, 0), fx(base * 100, 0), pBase < 0.001 ? '< 0.001' : '= ' + fx(pBase, 3))));
        if (a2 >= 0 && a2 <= 1 && n2 >= 5) {
          const se = Math.sqrt(a * (1 - a) / n + a2 * (1 - a2) / n2), zz = (a - a2) / se, p2 = 2 * (1 - 0.5 * (1 + erf(Math.abs(zz) / Math.SQRT2)));
          const [l2, h2] = wilson(a2, n2);
          st.push([S.other, `${fx(l2 * 100, 0)}–${fx(h2 * 100, 0)}%`, S.from(n2)]);
          vv.push(p2 < 0.05 ? verdict('good', S.real, S.realB(fx(a * 100, 0), fx(a2 * 100, 0), fx(p2, 3))) : verdict('warn', S.may, S.mayB(fx(a * 100, 0), fx(a2 * 100, 0), fx(p2, 2))));
        }
        return { html: U.stats(st) + vv.join('') + exportBtn() };
      }
    };

  function scatterSVG(S, id, obs, pred) {

<script>
// ---------------------------------------------------------------------------
// OMML (Word equation XML) -> linear text that norm() understands.
// Works on OOXML from Word.run getOoxml() (XML DOM) and on the OMML Word puts
// in the clipboard HTML when you copy an equation (HTML DOM, tag names keep
// their "m:" prefix). Plain text from Word (",A-B." form) loses the difference
// between fractions, subscripts and powers, so this is the reliable path.
// ---------------------------------------------------------------------------
(function () {
  const nm = n => (n && n.nodeType === 1) ? n.nodeName.toLowerCase().split(':').pop() : '';
  const kids = n => n ? [...n.childNodes].filter(c => c.nodeType === 1) : [];
  const kid = (n, name) => kids(n).find(c => nm(c) === name) || null;
  const kidsNamed = (n, name) => kids(n).filter(c => nm(c) === name);
  const val = n => {
    if (!n) return null;
    for (const a of ['m:val', 'val', 'w:val']) { const v = n.getAttribute(a); if (v !== null) return v; }
    return null;
  };
  const prop = (n, prName, key) => { const p = kid(n, prName); const k = p && kid(p, key); return k ? val(k) : undefined; };
  // a plain name, possibly with several subscript parts (X_bar_zoz) \u2014 never needs brackets
  const SIMPLE = /^[A-Za-z0-9.\u0370-\u03FF\u2202]+(?:_[A-Za-z0-9\u0370-\u03FF]+)*$/;
  const wrap = s => (SIMPLE.test(s) || /^\(.*\)$|\)$|\]$/.test(s)) ? s : `(${s})`;
  const clean = s => s.replace(/[^A-Za-z0-9\u0370-\u03FF]/g, '');
  const ACC = { '\u0302': 'hat', '^': 'hat', '\u0303': 'tilde', '~': 'tilde', '\u0304': 'bar', '\u0305': 'bar', '\u00AF': 'bar', '\u203E': 'bar', '\u0332': 'bar', '\u0307': 'dot', '\u20D7': '', '\u2192': '' };
  const SKIP = /pr$/; // property elements: rPr, fPr, dPr, ctrlPr, naryPr ...

  function lin(n, sub) {                    // convert the children of n (sub: inside a subscript/name, keep letters together)
    let out = '', prevStruct = false;
    for (const c of n.childNodes) {
      if (c.nodeType !== 1) continue;
      const name = nm(c);
      if (SKIP.test(name)) continue;
      // r/t are text runs; non-OMML wrappers (span, i, b from clipboard HTML) are transparent
      const isRun = name === 'r' || name === 't' || !c.nodeName.includes(':');
      const s = (name === 'r' || name === 't') ? runText(c, sub) : isRun ? lin(c, sub) : one(c, sub);
      if (!s) continue;
      if (out && (!isRun || prevStruct || (!sub && /[A-Za-z0-9.\u0370-\u03FF]$/.test(out) && /^[A-Za-z\u0370-\u03FF]/.test(s) && !/[0-9.]$/.test(out.slice(-1)) ))) out += ' ';
      out += s; prevStruct = !isRun;
    }
    return out.trim();
  }
  // In Word equations adjacent italic letters are a product (ax = a·x), so split
  // them, except function names, upright (plain-style) text and subscripts.
  const WORDS = /^(sin|cos|tan|cot|sec|csc|sinh|cosh|tanh|arcsin|arccos|arctan|asin|acos|atan|ln|log|exp|max|min|det|lim|sqrt|abs|erf|mod|inv|Infinity|pi)$/;
  function runText(r, sub) {
    const ts = kids(r).filter(c => nm(c) === 't');
    // Word types the star of X* as U+2217 "\u2217" (asterisk operator); make it a plain "*"
    let txt = (ts.length ? ts.map(t => t.textContent).join('') : r.textContent).replace(/\u2061/g, '').replace(/[\u2146]/g, 'd').normalize('NFKC').replace(/[\u2217\u22C6]/g, '*');
    const plain = prop(r, 'rpr', 'sty') === 'p' || /\bmathrm|upright/i.test(r.getAttribute && (r.getAttribute('style') || '') || '');
    if (sub || plain) return txt;
    // \u0394z, \u03B4x, \u2206t are one quantity (an increment), not \u0394 times z
    return txt.replace(/[A-Za-z\u0370-\u03FF\u2206]{2,}/g, w => WORDS.test(w) ? w : w.replace(/[\u0394\u03B4\u2206][A-Za-z]|./g, m => m + ' ').trim());
  }
  function one(c, sub) {
    const name = nm(c), e = () => lin(kid(c, 'e'), sub);
    switch (name) {
      case 'f': {
        const a = lin(kid(c, 'num'), sub), b = lin(kid(c, 'den'), sub);
        if (/^[∂𝜕d]\s*\S/.test(a) && /^[∂𝜕]\s*\S|^d\s*[A-Za-z\u0370-\u03FF]$/.test(b) && /^[∂𝜕]/.test(a) === /^[∂𝜕]/.test(b))
          return `(${a})/(${b})`;
        return `((${a})/(${b}))`;
      }
      case 'ssub': { const b = e(); return /[)\]]$/.test(b) ? b : `${b}_${clean(lin(kid(c, 'sub'), true))}`; }
      case 'ssup': return `${wrap(e())}^(${lin(kid(c, 'sup'), sub)})`;
      case 'ssubsup': { const b = e(), sb = clean(lin(kid(c, 'sub'), true)); return `${wrap(/[)\]]$/.test(b) ? b : b + '_' + sb)}^(${lin(kid(c, 'sup'), sub)})`; }
      case 'spre': return e();
      case 'rad': {
        const deg = lin(kid(c, 'deg'), sub), hide = prop(c, 'radpr', 'deghide');
        return (deg && hide !== '1' && hide !== 'on' && hide !== 'true') ? `nthRoot(${e()}, ${deg})` : `sqrt(${e()})`;
      }
      case 'd': {
        let beg = prop(c, 'dpr', 'begchr'), end = prop(c, 'dpr', 'endchr'), sep = prop(c, 'dpr', 'sepchr');
        beg = beg === undefined ? '(' : (beg || ''); end = end === undefined ? ')' : (end || '');
        sep = sep === undefined || sep === '' || sep === '|' || sep === '\u2502' ? ', ' : sep + ' ';
        const es = kidsNamed(c, 'e');
        const onlyMatrix = es.length === 1 && kids(es[0]).filter(x => !SKIP.test(nm(x))).length === 1 && nm(kids(es[0]).filter(x => !SKIP.test(nm(x)))[0]) === 'm';
        const inner = es.map(x => lin(x, sub)).join(sep);
        if (onlyMatrix) return (beg === '|' || beg === '\u2223') ? `det(${inner})` : inner;
        if ((beg === '|' || beg === '\u2223' || beg === '\u2016') && (end === beg || end === '|' || end === '\u2016')) return `abs(${inner})`;
        if (beg === '\u230A') return `floor(${inner})`;
        if (beg === '\u2308') return `ceil(${inner})`;
        const B = { '(': '(', '[': '[', '{': '(', '\u27E8': '(', '\u2329': '(', '': '' }, E = { ')': ')', ']': ']', '}': ')', '\u27E9': ')', '\u232A': ')', '': '' };
        const b = beg in B ? B[beg] : '(', d = end in E ? E[end] : ')';
        return b === '[' && d === ']' ? `[${inner}]` : `(${inner})`;   // [ ] with no commas is read as brackets by norm()
      }
      case 'm': {
        const rows = kidsNamed(c, 'mr').map(r => kidsNamed(r, 'e').map(x => lin(x, sub) || '0').join(', '));
        return `[${rows.join('; ')}]`;
      }
      case 'nary': {
        const chr = prop(c, 'narypr', 'chr') || '\u222B';
        const lo = lin(kid(c, 'sub'), sub), hi = lin(kid(c, 'sup'), sub);
        let body = e();
        if (chr === '\u222B') body = body.replace(/(^|[^A-Za-z0-9_])?d\s*([A-Za-z\u0370-\u03FF])\s*$/, (m, p, v) => `${p || ''} d${v}`);
        const sym = chr === '\u2211' ? '∑' : chr === '\u220F' ? '∏' : chr;
        return `${sym}${lo ? `_(${lo})` : ''}${hi ? `^(${hi})` : ''}▒(${body})`;
      }
      case 'func': {
        const f = lin(kid(c, 'fname'), true).replace(/\s+/g, ''), a = e();
        return /^\(.*\)$/.test(a) ? `${f}${a}` : `${f}(${a})`;
      }
      case 'acc': { const ch = prop(c, 'accpr', 'chr'), suf = ACC[ch === undefined ? '\u0302' : ch]; const b = e(); return suf && SIMPLE.test(b) ? `${b}_${suf}` : b; }
      case 'bar': { const b = e(); return SIMPLE.test(b) ? `${b}_bar` : b; }
      case 'limlow': case 'limupp': return `${lin(kid(c, 'e'), sub)} ${lin(kid(c, 'lim'), true)}`;
      case 'eqarr': return kidsNamed(c, 'e').map(x => lin(x, sub)).join('\n');
      case 'groupchr': case 'box': case 'borderbox': case 'phant': return e();
      case 'r': case 't': return runText(c, sub);
      default: return lin(c, sub);                 // oMath, e, num, spans/i/b from clipboard HTML ...
    }
  }

  const all = (root, name) => { const out = []; const walk = n => { for (const c of kids(n)) { if (nm(c) === name) out.push(c); else walk(c); } }; walk(root); return out; };
  const tidy = s => s.replace(/&/g, ' ').replace(/[\u00A0\s]+/g, ' ').trim();
  // one linear string per equation (an equation array gives one per row)
  window.ommlToLinear = node => node ? lin(node) : '';
  window.ommlEquations = root => all(root, 'omath').flatMap(m => lin(m).split('\n')).map(tidy).filter(Boolean);

  // Equations from Word OOXML (selection or whole document): each paragraph's
  // equations are read from OMML; paragraphs without equations use their text.
  window.equationsFromOoxml = (ooxml, eqLines) => {
    const doc = new DOMParser().parseFromString(ooxml, 'text/xml');
    const paras = all(doc.documentElement, 'p');
    const out = [];
    const roots = paras.length ? paras : [doc.documentElement];
    for (const p of roots) {
      const maths = all(p, 'omath');
      if (maths.length) { maths.forEach(m => lin(m).split('\n').map(tidy).filter(Boolean).forEach(x => out.push(x))); continue; }
      const text = all(p, 't').map(t => t.textContent).join('');
      eqLines(text).forEach(x => out.push(x));
    }
    return out;
  };

  // Same as equationsFromOoxml, but also records where each equation is: the paragraph's position in
  // the document (p) and whether the paragraph holds only the equation (display), so it can be
  // coloured and jumped to. count = number of paragraphs found, to check against Word's own count.
  window.equationPlaces = (ooxml, eqLines) => {
    const doc = new DOMParser().parseFromString(ooxml, 'text/xml');
    const body = all(doc.documentElement, 'body')[0] || doc.documentElement;
    const paras = all(body, 'p');
    const items = [];
    paras.forEach((p, i) => {
      const maths = all(p, 'omath');
      if (maths.length) {
        // text outside the equations: nothing but spaces, an equation number "(3)" or punctuation → a display equation
        const outside = all(p, 't').filter(t => { let n = t.parentNode; while (n && n !== p) { if (nm(n) === 'omath') return false; n = n.parentNode; } return true; }).map(t => t.textContent).join('');
        const display = !/[^\s\d().,;: ]/.test(outside);
        maths.forEach(m => lin(m).split('\n').map(tidy).filter(Boolean).forEach(x => items.push({ t: x, p: i, display })));
        return;
      }
      const text = all(p, 't').map(t => t.textContent).join('');
      eqLines(text).forEach(x => items.push({ t: x, p: i, display: true }));
    });
    return { count: paras.length, items };
  };

  // Equations from clipboard HTML copied out of Word (OMML hidden in msEquation comments)
  window.equationsFromClipboardHtml = html => {
    if (!html) return [];
    const blocks = [...html.matchAll(/<!--\[if gte msEquation 12\]>([\s\S]*?)<!\[endif\]-->/gi)].map(m => m[1]);
    if (!blocks.length && /<m:oMath/i.test(html)) blocks.push(html);
    const out = [];
    for (const b of blocks) {
      const doc = new DOMParser().parseFromString('<!doctype html><body>' + b + '</body>', 'text/html');
      window.ommlEquations(doc.body).forEach(x => out.push(x));
    }
    return out;
  };
})();
