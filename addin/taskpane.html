<style>

<body class="quarto-dark">

<script>
/* Helper for converting raw OMML MathML XML node streams directly into clean Linear math syntax */
function ommlToLinear(element) {
  if (!element) return "";
  let result = "";
  for (let child of element.childNodes) {
    const name = child.nodeName;

    if (name === "m:f") { 
      // Fraction -> (num)/(den)
      const numNode = child.getElementsByTagName("m:num")[0];
      const denNode = child.getElementsByTagName("m:den")[0];
      const num = ommlToLinear(numNode);
      const den = ommlToLinear(denNode);
      result += `(${num})/(${den})`;
    } 
    else if (name === "m:sSub") { 
      // Subscript -> base_sub
      const eNode = child.getElementsByTagName("m:e")[0];
      const subNode = child.getElementsByTagName("m:sub")[0];
      const e = ommlToLinear(eNode);
      const sub = ommlToLinear(subNode);
      result += `${e}_${sub}`;
    } 
    else if (name === "m:sSup") { 
      // Superscript -> base^(sup)
      const eNode = child.getElementsByTagName("m:e")[0];
      const supNode = child.getElementsByTagName("m:sup")[0];
      const e = ommlToLinear(eNode);
      const sup = ommlToLinear(supNode);
      result += `${e}^(${sup})`;
    } 
    else if (name === "m:rad") {
      // Square root or nth root -> sqrt(e) or nthRoot(e, deg)
      const eNode = child.getElementsByTagName("m:e")[0];
      const degNode = child.getElementsByTagName("m:deg")[0];
      const e = ommlToLinear(eNode);
      const deg = degNode ? ommlToLinear(degNode) : "";
      result += deg ? `nthRoot(${e}, ${deg})` : `sqrt(${e})`;
    }
    else if (name === "m:d") {
      // Delimiters e.g. (expr)
      const eNode = child.getElementsByTagName("m:e")[0];
      result += `(${ommlToLinear(eNode)})`;
    }
    else if (name === "m:t" || child.nodeType === 3) { 
      result += child.textContent;
    } 
    else {
      result += ommlToLinear(child);
    }
  }

  return result
    .replace(/[−–—]/g, '-')
    .replace(/\s+/g, ' ')
    .trim();
}

window.HM = (function () {
  const ES = (document.documentElement.lang || '').toLowerCase().startsWith('es');
  const T = ES ? {
    units: 'Unidades', us: 'Unidades de EE. UU.', si: 'Métricas', yours: 'Sus datos', work: 'Ver el cálculo', example: 'Ejemplo', link: 'Copiar enlace', print: 'Imprimir', reset: 'Empezar de nuevo',
    small: 'Gratis, sin registro, sin anuncios, y nada de lo que escribe sale de su navegador.',
    sayLab: 'Copie esto', copy: 'Copiar', linkCopied: 'Enlace copiado', copied: 'Copiado', check: 'Revise sus números.', copyThis: 'Copie esto:'
  } : {
    units: 'Units', us: 'US units', si: 'Metric', yours: 'Your numbers', work: 'Show the working', example: 'Example', link: 'Copy link', print: 'Print', reset: 'Start over',
    small: 'Free, no sign-up, no ads, and nothing you enter leaves your browser.',
    sayLab: 'Copy this', copy: 'Copy', linkCopied: 'Link copied', copied: 'Copied', check: 'Check your numbers.', copyThis: 'Copy this:'
  };
  const C = {
    len: { us: [0.3048, 'ft'], si: [1, 'm'] },
    num: { us: [1, ''], si: [1, ''] },
    money: { us: [1, '$'], si: [1, ''] }
  };
  const UNITLESS = ['num', 'pct', 'min', 'money', 'select', 'seg', 'check', 'info', 'sec', 'text', 'textarea'];

  const num = s => { s = String(s).replace(/[$,\s%]/g, ''); if (s === '') return null; return /^-?\d*\.?\d+$/.test(s) ? parseFloat(s) : NaN; };
  const fmt = (x, d = 2) => (x == null || !isFinite(x)) ? '–' : x.toLocaleString('en-US', { maximumFractionDigits: d, minimumFractionDigits: 0 });
  const fix = (x, d = 2) => (x == null || !isFinite(x)) ? '–' : x.toLocaleString('en-US', { maximumFractionDigits: d, minimumFractionDigits: d });
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  function getUnits() { return 'us'; }
  function toast(root, msg) { const t = root.querySelector('.toast'); if (!t) return; t.textContent = msg; t.classList.add('on'); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('on'), 1800); }

  function tool(cfg) {
    const root = document.getElementById(cfg.id);
    if (!root) return;
    let u = getUnits(), f = {}, raw = {};
    const inputs = cfg.inputs;
    const byK = Object.fromEntries(inputs.filter(i => i.k).map(i => [i.k, i]));

    function read() {
      const v = {};
      inputs.forEach(i => { if (!i.k) return; v[i.k] = f[i.k] !== undefined ? f[i.k] : null; });
      return v;
    }

    function fieldHTML(i) {
      const id = cfg.id + '-' + i.k;
      if (i.t === 'textarea') return `<div><label for="${id}">${i.l}</label><textarea id="${id}" data-k="${i.k}" rows="${i.rows || 6}" placeholder="${esc(i.ph || '')}">${esc(f[i.k] || '')}</textarea></div>`;
      if (i.t === 'seg') {
        const cur = String(f[i.k] || i.d);
        return `<div><label>${i.l}</label><div class="seg">${i.opts.map(o => `<button type="button" data-seg="${i.k}" data-v="${esc(o[0])}" aria-pressed="${String(o[0]) === cur}">${esc(o[1])}</button>`).join('')}</div></div>`;
      }
      return `<div><label for="${id}">${i.l}</label><input type="text" id="${id}" data-k="${i.k}" value="${esc(f[i.k] || '')}"></div>`;
    }

    function render() {
      let h = `<section class="cx"><div class="fg">`;
      inputs.forEach(i => { h += fieldHTML(i); });
      h += `</div></section><section class="cx res"></section><details class="cx hm-work"><summary>${T.work}</summary><div class="db"></div></details>`;
      root.innerHTML = h;
      run();
    }

    const U = {
      fmt, fix, esc,
      empty: t => `<p class="empty">${t}</p>`,
      note: (h, cls) => `<div class="note${cls ? ' ' + cls : ''}">${h}</div>`
    };

    function run() {
      const v = read();
      let out;
      try { out = cfg.compute(v, U) || {}; } catch (e) { out = { html: U.empty(T.check) }; }
      root.querySelector('.res').innerHTML = out.html || '';
      const wd = root.querySelector('.hm-work');
      wd.hidden = !out.work || !out.work.length;
      wd.querySelector('.db').innerHTML = out.work && out.work.length ? `<ol class="work">${out.work.map(w => `<li>${w}</li>`).join('')}</ol>` : '';
      
      if (window.MathJax && MathJax.typesetPromise) {
        MathJax.typesetPromise([root.querySelector('.res')]).catch(err => console.log(err));
      }
    }

    root.addEventListener('input', e => {
      const ta = e.target.closest('textarea[data-k]');
      if (ta) { f[ta.dataset.k] = ta.value; run(); }
    });
    root.addEventListener('click', e => {
      const b = e.target.closest('button');
      if (!b || !b.dataset.seg) return;
      f[b.dataset.seg] = b.dataset.v;
      b.parentElement.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
      run();
    });

    render();
    return { set: (k, val) => { f[k] = val; const ta = root.querySelector(`textarea[data-k="${k}"]`); if (ta) ta.value = val; run(); } };
  }

  return { tool, fmt, fix, num, esc };
})();

(function () {
  const GREEK = { alpha: 'α', beta: 'β', gamma: 'γ', delta: 'δ', epsilon: 'ε', zeta: 'ζ', eta: 'η', theta: 'θ', lambda: 'λ', mu: 'μ', nu: 'ν', xi: 'ξ', rho: 'ρ', sigma: 'σ', tau: 'τ', phi: 'φ', chi: 'χ', psi: 'ψ', omega: 'ω', Delta: 'Δ', Gamma: 'Γ', Theta: 'Θ', Lambda: 'Λ', Sigma: 'Σ', Phi: 'Φ', Psi: 'Ψ', Omega: 'Ω' };
  
  function norm(line) {
    let s = line.trim().replace(/^\(?\d+\)?[.:)]\s*/, '').replace(/[\s.,;]+$/, '');
    s = s.replace(/∂/g, 'd_').replace(/∇/g, 'grad_').replace(/[−–—]/g, '-').replace(/\s+/g, ' ');
    return { s, unsupported: false };
  }

  HM.tool({
    id: 'eq', step: 'Equations', units: false, hash: false,
    inputs: [
      { k: 'eqs', l: 'Equations, one per line:', t: 'textarea', rows: 6, ph: 'q = -K*dh/dz\ndX_dz = (X_l - X_u)/(z_l - z_u)' },
      { k: 'sign', l: 'Variables are', t: 'seg', d: 'pos', opts: [['pos', 'Positive'], ['any', 'Any sign']] }
    ],
    compute(v, U) {
      if (typeof math === 'undefined') return U.empty('Loading evaluator engine...');
      const rawText = String(v.eqs || '').trim();
      if (!rawText) return U.empty('Select or paste at least one equation.');

      const lines = rawText.split(/\r?\n/).filter(l => l.trim());
      const rows = [];

      lines.forEach((ln, i) => {
        const nr = norm(ln);
        const sp = nr.s.split(/(?<![<>!=])=(?!=)/);
        if (sp.length !== 2) {
          rows.push([i + 1, U.esc(ln), '<span class="tag bad">Invalid equation</span>', 'Equation must contain exactly one "=" sign.']);
          return;
        }

        try {
          const lhs = sp[0].trim();
          const rhs = sp[1].trim();
          const L = math.parse(lhs);
          const R = math.parse(rhs);

          let status = '<span class="tag good">Reads & Evaluates</span>';
          let note = `Left side parsed as <code>${U.esc(L.toString())}</code>; Right side parsed as <code>${U.esc(R.toString())}</code>.`;

          rows.push([i + 1, `\\(${U.esc(lhs)} = ${U.esc(rhs)}\\)`, status, note]);
        } catch (err) {
          rows.push([i + 1, U.esc(ln), '<span class="tag bad">Cannot read</span>', U.esc(err.message)]);
        }
      });

      let h = `<table class="tt"><thead><tr><th>#</th><th>Parsed Expression</th><th>Status</th></tr></thead><tbody>${rows.map(r => `<tr><td>${r[0]}</td><td>${r[1]}<br><span style="font-size:.85rem; color:var(--ink-2)">${r[3]}</span></td><td>${r[2]}</td></tr>`).join('')}</tbody></table>`;
      return { html: h, work: ['Parsed native OMML XML directly into Math.js expression trees.'] };
    }
  });
})();
</script>

<p class="ra-foot">How to cite: Flynn, T. (2026). <i>Check a result: plausibility checks for soil and environmental results</i> [software]. <a href="https://doi.org/10.5281/zenodo.23736495" target="_blank" rel="noopener">https://doi.org/10.5281/zenodo.23736495</a></p>

<script>
(function () {
  const msg = t => document.getElementById('ra-msg').textContent = t;
  const setEqs = text => {
    const el = document.getElementById('eq-eqs');
    if (!el) return;
    el.value = text;
    el.dispatchEvent(new Event('input', { bubbles: true }));
  };

  const eqLines = t => t.split(/\r?\n|\r/)
    .map(s => s.replace(/[\u00A0\s]+/g, ' ').trim())
    .filter(s => s.length > 0 && /[^=<>!]=[^=]/.test(s));

  if (typeof Office === 'undefined') {
    msg('Running outside Office/Word. Paste equations directly into the text box below.');
    return;
  }

  Office.onReady(info => {
    if (info.host !== Office.HostType.Word) {
      msg('Running outside Word. Paste equations directly into the text box below.');
      return;
    }

    if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
      document.body.className = 'quarto-dark';
    } else {
      document.body.className = 'quarto-light';
    }

    // MAIN SELECTION HANDLER: Uses OOXML/OMML XML extraction to bypass plain text character distortion
    document.getElementById('ra-sel').onclick = () => Word.run(async ctx => {
      const selection = ctx.document.getSelection();
      const ooxml = selection.getOoxml();
      await ctx.sync();

      const parser = new DOMParser();
      const xmlDoc = parser.parseFromString(ooxml.value, "text/xml");
      const mathNodes = xmlDoc.getElementsByTagName("m:oMath");

      let extractedEqs = [];

      if (mathNodes.length > 0) {
        for (let node of mathNodes) {
          let eqText = ommlToLinear(node);
          if (eqText && eqText.includes('=')) {
            extractedEqs.push(eqText);
          }
        }
      }

      // Fallback if no formal Alt+= Word Math objects were in selection
      if (extractedEqs.length === 0) {
        selection.load('text');
        await ctx.sync();
        extractedEqs = eqLines(selection.text || '');
      }

      if (!extractedEqs.length) {
        msg('No valid equation with "=" found in the selection.');
        return;
      }

      setEqs(extractedEqs.join('\n'));
      msg(`Cleanly loaded ${extractedEqs.length} equation(s) from Word selection.`);
    }).catch(e => msg('Error reading document selection: ' + e.message));

    document.getElementById('ra-doc').onclick = () => Word.run(async ctx => {
      const ps = ctx.document.body.paragraphs; ps.load('items/text'); await ctx.sync();
      const lines = ps.items.flatMap(p => eqLines(p.text || ''));
      if (!lines.length) { msg('No equation-like lines found in the document.'); return; }
      setEqs(lines.slice(0, 60).join('\n')); msg(`Found ${lines.length} equation-like line(s).`);
    }).catch(e => msg('Error reading document: ' + e.message));
  });
})();
</script>
</body></html>
