<style>
.hmc {
  --bg: #161412; --surface: #1f1c19; --surface-2: #2a2622; --ink: #f0ece4; --ink-2: #c4bdb1; --ink-3: #8f887d;
  --line: #3a352f; --accent: #d98b56; --accent-ink: #1a1410; --accent-soft: #3a2a1f; --warn: #e0a440; --good: #5cc28f; --bad: #e07070;
  color: var(--ink); font-size: 1.02rem; line-height: 1.5; max-width: 620px; margin: 8px auto 28px;
}
body.quarto-light .hmc {
  --bg: #f7f5f0; --surface: #fffdf9; --surface-2: #efebe2; --ink: #1f1c17; --ink-2: #57514a; --ink-3: #8a8379;
  --line: #ddd6ca; --accent: #8a4b22; --accent-ink: #ffffff; --accent-soft: #f3e6da; --warn: #9a6400; --good: #1f7a4d; --bad: #b3261e;
}
.hmc * { box-sizing: border-box; }
.hmc .cx { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-top: 12px; }
.hmc .step { font-size: .78rem; color: var(--ink-3); text-transform: uppercase; letter-spacing: .1em; font-weight: 600; margin: 0 0 6px; }
.hmc .hint { font-size: .9rem; color: var(--ink-2); margin: 6px 0 0; }
.hmc .fg { display: grid; grid-template-columns: repeat(6, 1fr); column-gap: 10px; }
.hmc .fg > div { grid-column: span 6; }
.hmc label { display: block; font-size: .9rem; font-weight: 600; color: var(--ink-2); margin: 10px 0 4px; }
.hmc textarea { width: 100%; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); font: .88rem ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; padding: 8px 12px; resize: vertical; display: block; }
.hmc input:focus, .hmc select:focus, .hmc textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.hmc .seg { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
.hmc .seg button { flex: 1 1 auto; min-height: 38px; border: 1px solid var(--line); background: transparent; color: var(--ink); border-radius: 999px; padding: 4px 12px; font: inherit; font-weight: 600; cursor: pointer; }
.hmc .seg button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.hmc .res { border: 2px solid var(--accent); overflow-x: auto; margin-top: 12px; }
.hmc .note { border-left: 3px solid var(--warn); background: color-mix(in srgb, var(--warn) 10%, transparent); padding: 8px 12px; border-radius: 0 10px 10px 0; font-size: .9rem; color: var(--ink-2); margin-top: 10px; }
.hmc .note.good { border-left-color: var(--good); background: color-mix(in srgb, var(--good) 10%, transparent); }
.hmc .note.bad { border-left-color: var(--bad); background: color-mix(in srgb, var(--bad) 10%, transparent); }
.hmc .tag { display: inline-block; font-size: .75rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; border-radius: 999px; padding: 1px 9px; border: 1px solid currentColor; }
.hmc .tag.good { color: var(--good); } .hmc .tag.warn { color: var(--warn); } .hmc .tag.bad { color: var(--bad); }
.hmc .tag.off { color: var(--ink-3); }
.hmc table.tt td .tag { word-break: normal; overflow-wrap: normal; white-space: normal; text-align: center; }
.hmc button.st { all: unset; cursor: pointer; display: inline-flex; flex-wrap: wrap; gap: 4px; border-radius: 8px; padding: 2px; }
.hmc button.st:hover .tag, .hmc button.st:focus-visible .tag { background: var(--accent-soft); }
.hmc button.st:focus-visible { outline: 2px solid var(--accent); }
.hmc tr.off td:nth-child(1), .hmc tr.off td:nth-child(2) { opacity: .5; text-decoration: line-through; text-decoration-color: var(--ink-3); }
.hmc .topbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
.hmc select.ra-lang { min-height: 34px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); font: inherit; font-size: .9rem; padding: 2px 8px; cursor: pointer; }
.hmc label.auto { display: none; margin: 0; font-weight: 500; font-size: .85rem; color: var(--ink-2); }
body.in-word .hmc label.auto { display: inline-flex; align-items: center; gap: 6px; }

.hmc table.tt { width: 100%; border-collapse: collapse; font-size: .93rem; margin-top: 8px; table-layout: fixed; }
.hmc table.tt th, .hmc table.tt td { text-align: left; padding: 7px 6px; border-top: 1px solid var(--line); vertical-align: top; word-break: break-word; overflow-wrap: break-word; }
.hmc table.tt th { color: var(--ink-3); font-weight: 600; font-size: .8rem; text-transform: uppercase; letter-spacing: .05em; border-top: none; }
.hmc table.tt td:nth-child(1) { width: 10%; }
.hmc table.tt td:nth-child(2) { width: 65%; overflow-x: auto; }
.hmc table.tt td:nth-child(3) { width: 25%; }

.hmc details.cx { padding: 0; }
.hmc details summary { cursor: pointer; padding: 14px 16px; font-weight: 600; color: var(--accent); list-style: none; }
.hmc details summary::-webkit-details-marker { display: none; }
.hmc details summary::before { content: "＋ "; }
.hmc details[open] summary::before { content: "－ "; }
.hmc details .db { padding: 0 16px 16px; }
.hmc ol.work { font-size: .92rem; color: var(--ink-2); margin: 0; padding-left: 18px; }
.hmc ol.work li { margin-bottom: 6px; font-variant-numeric: tabular-nums; }

<script>
// ---------------------------------------------------------------------------
// OMML (Word equation XML) -> linear text that norm() understands.
// Works on OOXML from Word.run getOoxml() (XML DOM) and on the OMML Word puts
// in the clipboard HTML when you copy an equation (HTML DOM, tag names keep
// their "m:" prefix). Plain text from Word (",A-B." form) loses the difference
// between fractions, subscripts and powers, so this is the reliable path.
// ---------------------------------------------------------------------------
(function () {
  const nm = n => (n && n.nodeType === 1) ? n.nodeName.toLowerCase().split(':').pop() : '';
  const kids = n => n ? [...n.childNodes].filter(c => c.nodeType === 1) : [];
  const kid = (n, name) => kids(n).find(c => nm(c) === name) || null;
  const kidsNamed = (n, name) => kids(n).filter(c => nm(c) === name);
  const val = n => {
    if (!n) return null;
    for (const a of ['m:val', 'val', 'w:val']) { const v = n.getAttribute(a); if (v !== null) return v; }
    return null;
  };
  const prop = (n, prName, key) => { const p = kid(n, prName); const k = p && kid(p, key); return k ? val(k) : undefined; };
  // a plain name, possibly with several subscript parts (X_bar_zoz) \u2014 never needs brackets
  const SIMPLE = /^[A-Za-z0-9.\u0370-\u03FF\u2202]+(?:_[A-Za-z0-9\u0370-\u03FF]+)*$/;
  const wrap = s => (SIMPLE.test(s) || /^\(.*\)$|\)$|\]$/.test(s)) ? s : `(${s})`;
  const clean = s => s.replace(/[^A-Za-z0-9\u0370-\u03FF]/g, '');
  const ACC = { '\u0302': 'hat', '^': 'hat', '\u0303': 'tilde', '~': 'tilde', '\u0304': 'bar', '\u0305': 'bar', '\u00AF': 'bar', '\u203E': 'bar', '\u0332': 'bar', '\u0307': 'dot', '\u20D7': '', '\u2192': '' };
  const SKIP = /pr$/; // property elements: rPr, fPr, dPr, ctrlPr, naryPr ...

  function lin(n, sub) {                    // convert the children of n (sub: inside a subscript/name, keep letters together)
    let out = '', prevStruct = false;
    for (const c of n.childNodes) {
      if (c.nodeType !== 1) continue;
      const name = nm(c);
      if (SKIP.test(name)) continue;
      // r/t are text runs; non-OMML wrappers (span, i, b from clipboard HTML) are transparent
      const isRun = name === 'r' || name === 't' || !c.nodeName.includes(':');
      const s = (name === 'r' || name === 't') ? runText(c, sub) : isRun ? lin(c, sub) : one(c, sub);
      if (!s) continue;
      if (out && (!isRun || prevStruct || (!sub && /[A-Za-z0-9.\u0370-\u03FF]$/.test(out) && /^[A-Za-z\u0370-\u03FF]/.test(s) && !/[0-9.]$/.test(out.slice(-1)) ))) out += ' ';
      out += s; prevStruct = !isRun;
    }
    return out.trim();
  }
  // In Word equations adjacent italic letters are a product (ax = a·x), so split
  // them, except function names, upright (plain-style) text and subscripts.
  const WORDS = /^(sin|cos|tan|cot|sec|csc|sinh|cosh|tanh|arcsin|arccos|arctan|asin|acos|atan|ln|log|exp|max|min|det|lim|sqrt|abs|erf|mod|inv|Infinity|pi)$/;
  function runText(r, sub) {
    const ts = kids(r).filter(c => nm(c) === 't');
    // Word types the star of X* as U+2217 "\u2217" (asterisk operator); make it a plain "*"
    let txt = (ts.length ? ts.map(t => t.textContent).join('') : r.textContent).replace(/\u2061/g, '').replace(/[\u2146]/g, 'd').normalize('NFKC').replace(/[\u2217\u22C6]/g, '*');
    const plain = prop(r, 'rpr', 'sty') === 'p' || /\bmathrm|upright/i.test(r.getAttribute && (r.getAttribute('style') || '') || '');
    if (sub || plain) return txt;
    // \u0394z, \u03B4x, \u2206t are one quantity (an increment), not \u0394 times z
    return txt.replace(/[A-Za-z\u0370-\u03FF\u2206]{2,}/g, w => WORDS.test(w) ? w : w.replace(/[\u0394\u03B4\u2206][A-Za-z]|./g, m => m + ' ').trim());
  }
  function one(c, sub) {
    const name = nm(c), e = () => lin(kid(c, 'e'), sub);
    switch (name) {
      case 'f': {
        const a = lin(kid(c, 'num'), sub), b = lin(kid(c, 'den'), sub);
        if (/^[∂𝜕d]\s*\S/.test(a) && /^[∂𝜕]\s*\S|^d\s*[A-Za-z\u0370-\u03FF]$/.test(b) && /^[∂𝜕]/.test(a) === /^[∂𝜕]/.test(b))
          return `(${a})/(${b})`;
        return `((${a})/(${b}))`;
      }
      case 'ssub': { const b = e(); return /[)\]]$/.test(b) ? b : `${b}_${clean(lin(kid(c, 'sub'), true))}`; }
      case 'ssup': return `${wrap(e())}^(${lin(kid(c, 'sup'), sub)})`;
      case 'ssubsup': { const b = e(), sb = clean(lin(kid(c, 'sub'), true)); return `${wrap(/[)\]]$/.test(b) ? b : b + '_' + sb)}^(${lin(kid(c, 'sup'), sub)})`; }
      case 'spre': return e();
      case 'rad': {
        const deg = lin(kid(c, 'deg'), sub), hide = prop(c, 'radpr', 'deghide');
        return (deg && hide !== '1' && hide !== 'on' && hide !== 'true') ? `nthRoot(${e()}, ${deg})` : `sqrt(${e()})`;
      }
      case 'd': {
        let beg = prop(c, 'dpr', 'begchr'), end = prop(c, 'dpr', 'endchr'), sep = prop(c, 'dpr', 'sepchr');
        beg = beg === undefined ? '(' : (beg || ''); end = end === undefined ? ')' : (end || '');
        sep = sep === undefined || sep === '' || sep === '|' || sep === '\u2502' ? ', ' : sep + ' ';
        const es = kidsNamed(c, 'e');
        const onlyMatrix = es.length === 1 && kids(es[0]).filter(x => !SKIP.test(nm(x))).length === 1 && nm(kids(es[0]).filter(x => !SKIP.test(nm(x)))[0]) === 'm';
        const inner = es.map(x => lin(x, sub)).join(sep);
        if (onlyMatrix) return (beg === '|' || beg === '\u2223') ? `det(${inner})` : inner;
        if ((beg === '|' || beg === '\u2223' || beg === '\u2016') && (end === beg || end === '|' || end === '\u2016')) return `abs(${inner})`;
        if (beg === '\u230A') return `floor(${inner})`;
        if (beg === '\u2308') return `ceil(${inner})`;
        const B = { '(': '(', '[': '[', '{': '(', '\u27E8': '(', '\u2329': '(', '': '' }, E = { ')': ')', ']': ']', '}': ')', '\u27E9': ')', '\u232A': ')', '': '' };
        const b = beg in B ? B[beg] : '(', d = end in E ? E[end] : ')';
        return b === '[' && d === ']' ? `[${inner}]` : `(${inner})`;   // [ ] with no commas is read as brackets by norm()
      }
      case 'm': {
        const rows = kidsNamed(c, 'mr').map(r => kidsNamed(r, 'e').map(x => lin(x, sub) || '0').join(', '));
        return `[${rows.join('; ')}]`;
      }
      case 'nary': {
        const chr = prop(c, 'narypr', 'chr') || '\u222B';
        const lo = lin(kid(c, 'sub'), sub), hi = lin(kid(c, 'sup'), sub);
        let body = e();
        if (chr === '\u222B') body = body.replace(/(^|[^A-Za-z0-9_])?d\s*([A-Za-z\u0370-\u03FF])\s*$/, (m, p, v) => `${p || ''} d${v}`);
        const sym = chr === '\u2211' ? '∑' : chr === '\u220F' ? '∏' : chr;
        return `${sym}${lo ? `_(${lo})` : ''}${hi ? `^(${hi})` : ''}▒(${body})`;
      }
      case 'func': {
        const f = lin(kid(c, 'fname'), true).replace(/\s+/g, ''), a = e();
        return /^\(.*\)$/.test(a) ? `${f}${a}` : `${f}(${a})`;
      }
      case 'acc': { const ch = prop(c, 'accpr', 'chr'), suf = ACC[ch === undefined ? '\u0302' : ch]; const b = e(); return suf && SIMPLE.test(b) ? `${b}_${suf}` : b; }
      case 'bar': { const b = e(); return SIMPLE.test(b) ? `${b}_bar` : b; }
      case 'limlow': case 'limupp': return `${lin(kid(c, 'e'), sub)} ${lin(kid(c, 'lim'), true)}`;
      case 'eqarr': return kidsNamed(c, 'e').map(x => lin(x, sub)).join('\n');
      case 'groupchr': case 'box': case 'borderbox': case 'phant': return e();
      case 'r': case 't': return runText(c, sub);
      default: return lin(c, sub);                 // oMath, e, num, spans/i/b from clipboard HTML ...
    }
  }

  const all = (root, name) => { const out = []; const walk = n => { for (const c of kids(n)) { if (nm(c) === name) out.push(c); else walk(c); } }; walk(root); return out; };
  const tidy = s => s.replace(/&/g, ' ').replace(/[\u00A0\s]+/g, ' ').trim();
  // one linear string per equation (an equation array gives one per row)
  window.ommlToLinear = node => node ? lin(node) : '';
  window.ommlEquations = root => all(root, 'omath').flatMap(m => lin(m).split('\n')).map(tidy).filter(Boolean);

  // Equations from Word OOXML (selection or whole document): each paragraph's
  // equations are read from OMML; paragraphs without equations use their text.
  window.equationsFromOoxml = (ooxml, eqLines) => {
    const doc = new DOMParser().parseFromString(ooxml, 'text/xml');
    const paras = all(doc.documentElement, 'p');
    const out = [];
    const roots = paras.length ? paras : [doc.documentElement];
    for (const p of roots) {
      const maths = all(p, 'omath');
      if (maths.length) { maths.forEach(m => lin(m).split('\n').map(tidy).filter(Boolean).forEach(x => out.push(x))); continue; }
      const text = all(p, 't').map(t => t.textContent).join('');
      eqLines(text).forEach(x => out.push(x));
    }
    return out;
  };

  // Equations from clipboard HTML copied out of Word (OMML hidden in msEquation comments)
  window.equationsFromClipboardHtml = html => {
    if (!html) return [];
    const blocks = [...html.matchAll(/<!--\[if gte msEquation 12\]>([\s\S]*?)<!\[endif\]-->/gi)].map(m => m[1]);
    if (!blocks.length && /<m:oMath/i.test(html)) blocks.push(html);
    const out = [];
    for (const b of blocks) {
      const doc = new DOMParser().parseFromString('<!doctype html><body>' + b + '</body>', 'text/html');
      window.ommlEquations(doc.body).forEach(x => out.push(x));
    }
    return out;
  };
})();

    },

            if (integ0 && /_bar/.test(other.toString())) flags.push(`A bar usually marks a mean. A mean over the interval would divide by (upper \u2212 lower limit); as written this is the integrated total, in units of ${F} \u00d7 ${v0}.`);
            push([lab, readAs, '<span class="tag good">' + t.tagDef + '</span>' + (flags.length ? ' <span class="tag warn">' + t.tagNotation + '</span>' : ''),
              `${F}(${v0}) is read as a function of ${v0} (a profile), not ${F} \u00d7 ${v0}. It has no numeric value to test, so this equation is checked as a definition only.` + (flags.length ? ' ' + flags.join(' ') : '')]);
            return;
          }

          if (e.indef) {
            const r = checkIndef(e, pos); e.skip = true; E.push(e);
            const tag = !r.tried ? '<span class="tag bad">Never evaluates</span>' : r.ok === r.tried ? '<span class="tag good">Antiderivative holds</span>' : '<span class="tag bad">Not an antiderivative</span>';
            push([lab, readAs, tag, !r.tried ? 'The other side could not be evaluated.' : r.ok === r.tried ? `Differentiating the other side with respect to ${r.v} gives the integrand in all ${r.tried} tests.` : `Derivative gives ${HM.fmt(r.fail.d, 4)} at ${r.fail.v} = ${HM.fmt(r.fail.x, 3)}, but integrand is ${HM.fmt(r.fail.y, 4)}.`]);
            return;
          }
          // weights in sums without limits: in ∑_h P(h) ∑_c w_c CN_{h,c}, P and w are the leading
          // indexed factors multiplying something else indexed; they are scaled to sum to 1.
          e.weights = [];
          const flat = n => n.isParenthesisNode ? flat(n.content) : n.isOperatorNode && n.fn === 'multiply' ? n.args.flatMap(flat) : n.isFunctionNode && n.fn.name === 'sq' ? flat(n.args[0]) : [n];
          [L, R].forEach(side => side.traverse(n => {
            if (!(n.isFunctionNode && n.fn && n.fn.name === 'sumn')) return;
            const v = n.args[1].name, up = n.args[3] && (n.args[3].isParenthesisNode ? n.args[3].content : n.args[3]);
            if (!(up && up.isSymbolNode && up.name === 'N_' + v)) return;
            const fs = flat(n.args[0]), wi = fs.findIndex(x => x.isSymbolNode && x.name.endsWith('_' + v));
            // ∑_h P(h) = 1 on its own is the statement that P is a set of weights
            const other = side === L ? R : L, unitSum = fs.length === 1 && side.toString() === n.toString() && other.isConstantNode && +other.value === 1;
            if (unitSum && wi === 0) { e.weights.push({ name: fs[0].name.slice(0, -(v.length + 1)), N: 'N_' + v }); return; }
            if (wi < 0 || fs.length < 2) return;
            const restIdx = fs.some((x, k) => k !== wi && (x.isAccessorNode || /sumn\(|_/.test(x.toString())));
            if (restIdx && !e.weights.some(w => w.name === fs[wi].name.slice(0, -(v.length + 1)))) e.weights.push({ name: fs[wi].name.slice(0, -(v.length + 1)), N: 'N_' + v });
          }));
          e.kinds = shapes(e, known); e.vs = Object.keys(e.kinds); e.readAs = readAs; e.row = rows.length; rows.push(null); E.push(e);
        } catch (err) { push([lab, U.esc(ln), '<span class="tag bad">Cannot read</span>', U.esc(err.message) + (/,[^,]*-[^,]*\./.test(ln) && /[\u{1D400}-\u{1D7FF}\u2212]/u.test(ln) ? ' This is Word\'s flattened text, which loses fractions, subscripts and powers. Highlight the equation in Word and click "Check the selected equations", or copy it in Word and paste it straight into this box.' : '')]); }
      });

      const shared = {}; E.forEach(e => { if (!e.skip) for (const [x, k] of Object.entries(e.kinds)) if (k !== 's' && (!shared[x] || k.startsWith('sz:'))) shared[x] = k; });
      E.forEach(e => {
        if (e.skip) return; const k2 = { ...e.kinds }; let changed = false;
        for (const x of e.vs) if (shared[x] && k2[x] !== shared[x]) { k2[x] = shared[x]; changed = true; }
        if (!changed) return;
        if (e.mctx) { e.kinds = k2; e.sharedSizes = true; }
        else if ([0, 1, 2].some(() => isFinite(residual(e, scopeOf(k2, true)).scale))) e.kinds = k2;
      });
      // a quantity defined by another equation (CN = …) that this one uses (CN_sd = √(… − CN²))
      const definesSym = D => D.lhsSym && !Object.keys(freeVars(D.R)).includes(D.lhsSym);
      E.forEach(e => { if (!e.skip) e.deps = E.filter(D => D !== e && !D.skip && definesSym(D) && D.lhsSym !== e.lhsSym && e.vs.includes(D.lhsSym) && !(e.lhsSym && D.vs.includes(e.lhsSym))); });
      E.forEach(e => {
        if (e.skip) return;
        const n = e.vs.length ? (e.heavy ? 30 : 200) : 1;
        const trial = () => { const o = { bad: 0, ex: null, mism: 0, held: 0, miss: null, cx: 0 };
          for (let k = 0; k < n; k++) {
            const sc = scopeOf(e.kinds, pos); const r = residual(e, sc);
            if (!isFinite(r.scale) || !isFinite(r.res)) { o.bad++; if (!o.ex) o.ex = sc; if (!sides(e, sc)) { if (LASTCX) { o.cx++; if (!o.cxSc) o.cxSc = sc; } else o.mism++; } }
            else if (r.res / r.scale < 1e-6) o.held++; else if (!o.miss) o.miss = { sc, val: r.val };
          } return o; };
        let T = trial();
        // undefined in places on its own: try again with the other equations' definitions plugged in
        if (T.bad && e.deps.length) {
          // the paper's own definition (CN from equation 1) is the right one to test with; drop it
          // only if it makes the equation unreadable for a reason other than a complex value
          e.useDeps = true; const T2 = trial();
          if (T2.bad < n || T2.cx || T.bad === n) T = T2; else e.useDeps = false;
        }
        let { bad, ex, mism, held, miss, cx, cxSc } = T;
        const defines = e.lhsSym && !Object.keys(freeVars(e.R)).includes(e.lhsSym);
        const ok = n - bad;
        e.identity = ok > 0 && held === ok;
        let tag, txt = '';
        const kindTxt = Object.entries(e.kinds).filter(([, k]) => k !== 's').map(([x, k]) => `${x} (${{ int: 'whole number', vec: 'list', m: '2×2 matrix', v: '2×1 vector', tab1: 'list', tab2: 'table', tab3: 'table' }[k] || k.replace('sz:', '').replace('x', '×')})`);
        const scTxt = sc => Object.entries(sc).filter(([, x]) => !isArr(x)).map(([a, b]) => `${a} = ${HM.fmt(b, 3)}`).join(', ');
        if (bad === n) { tag = '<span class="tag bad">Never evaluates</span>'; txt = mism === n && e.vs.length ? (e.sharedSizes ? ' Variable dimensions mismatch across equations.' : ' Matrices or expressions cannot be evaluated.') : ' Expression does not produce real finite numbers.'; }
        else if (e.identity && !defines) { tag = '<span class="tag good">Holds</span>'; txt = e.vs.length ? ` Both sides agree for all ${ok} test values.` : ' Both sides agree.'; }
        else if (!defines && (e.heavy || !e.vs.length)) { tag = '<span class="tag bad">Does not hold</span>'; e.fails = true; const [l, r] = miss.val; txt = ` Left side is ${fmtV(l)} and right side is ${fmtV(r)}.`; }
        else if (e.grad && miss) { tag = '<span class="tag bad">Does not hold</span>'; e.fails = true; txt = ` ∇_${e.grad.c} ${pretty(e.grad.name)} should be (${[...e.grad.c].map(c => `∂${pretty(e.grad.name)}/∂${c}`).join(', ')}), in that order; the right side differs.`; }
        else tag = bad === 0 ? '<span class="tag good">Evaluates cleanly</span>' : '<span class="tag warn">Undefined in places</span>';
        if (bad && bad < n) txt += ` Undefined for ${Math.round(100 * bad / n)}% of test values${scTxt(ex) ? `, e.g. ${scTxt(ex)}` : ''}.`;
        if (bad && cx) {
          if (cx === n) txt = txt.replace(' Expression does not produce real finite numbers.', '');
          txt += ' ' + cxReason(e, cxSc) + (e.useDeps ? ` (with ${e.deps.map(D => `${pretty(D.lhsSym)} from equation ${D.i}`).join(', ')})` : '') + '.';
        }
        const N_ = Object.keys(e.kinds).filter(x => /^N_/.test(x));
        if (N_.length) txt += ` Sums written without limits run over all categories (1 … ${N_.join(', ')}).` + (e.weights.length ? ` ${e.weights.map(w => w.name).join(' and ')} ${e.weights.length > 1 ? 'are' : 'is'} taken as weights that sum to 1.` : '');
        if (e.useDeps) txt += ` ${e.deps.map(D => `${pretty(D.lhsSym)} is taken from equation ${D.i}`).join('; ')}.`;
        if (e.grad && e.identity) txt = ` The components are the partial derivatives of ${pretty(e.grad.name)} with respect to ${[...e.grad.c].join(' and ')}, in order.`;
        rows[e.row] = [e.i, e.readAs, tag, `Variables: ${e.vs.join(', ') || 'none'}${kindTxt.length ? `; sizes: ${kindTxt.join(', ')}` : ''}.${txt}`, e.li];
      });

      // Rearrangement consistency tests
      let samePairs = 0;
      const pairs = [], EE = E.filter(e => !e.skip), RR = EE.filter(e => !e.fails && !(e.identity && (e.heavy || !e.vs.length)));
      for (let a = 0; a < RR.length; a++) for (let b = a + 1; b < RR.length; b++) {
        const A = RR[a], B = RR[b], sa = A.vs.slice().sort().join(), sb = B.vs.slice().sort().join();
        if (!A.vs.length || sa !== sb) continue;
        samePairs++;
        const iso = X => X.lhsSym && !Object.keys({ ...freeVars(X.R) }).includes(X.lhsSym) ? X.lhsSym : null;
        const u = iso(B) || iso(A) || (B.lhsSym && B.vs.includes(B.lhsSym) ? B.lhsSym : A.lhsSym && A.vs.includes(A.lhsSym) ? A.lhsSym : A.vs[0]);
        const [P, Q] = B.lhsSym === u ? [A, B] : [B, A];
        const kinds = { ...P.kinds, ...Q.kinds };
        let ok = 0, tried = 0, fail = null;
        for (let k = 0; k < 40 && tried < 12; k++) {
          const sc = scopeOf(kinds, pos); delete sc[u];
          let r;
          if (iso(Q) === u) { try { r = Q.Rc.evaluate({ ...sc }); } catch (e) { continue; } }
          else if (kinds[u] === 's') { const g = x => { try { return real(Q.Lc.evaluate({ ...sc, [u]: x })) - real(Q.Rc.evaluate({ ...sc, [u]: x })); } catch (e) { return NaN; } }; r = root(g); if (r == null) continue; }
          else continue;
          if (!isArr(r) && !isFinite(real(r))) continue;
          tried++;
          const rs = residual(P, { ...sc, [u]: r });
          if (isFinite(rs.res) && rs.res / rs.scale < 1e-6) ok++; else if (!fail) fail = { sc, r, res: rs.res };
        }
        if (!tried) continue;
        const scTxt = f => Object.entries(f.sc).filter(([, x]) => !isArr(x)).map(([a, b]) => `${a} = ${HM.fmt(b, 3)}`).join(', ');
        pairs.push(ok === tried ? U.note(`Equation ${Q.i} is consistent with equation ${P.i}: solving ${Q.i} for ${u} satisfies ${P.i} in all ${tried} random tests.`, 'good')
          : U.note(`Equation ${Q.i} does not follow from equation ${P.i}.${scTxt(fail) ? ` For ${scTxt(fail)},` : ''} equation ${Q.i} gives ${u} = ${fmtV(fail.r)}, which leaves equation ${P.i} off by ${isFinite(fail.res) ? HM.fmt(fail.res, 4) : 'an undefined amount'}.`, 'bad'));
      }

      // Worked example solving
      const ex = [];
      if (Object.keys(known).length) RR.forEach(e => {
        const miss = e.vs.filter(x => !(x in known));
        if (miss.length === 0) { const r = residual(e, { ...known }); ex.push(isFinite(r.res) && r.res / r.scale < 1e-3 ? U.note(`Equation ${e.i} holds for the example values.`, 'good') : U.note(`Equation ${e.i} does not hold for the example: left side − right side = ${isFinite(r.res) ? (r.val ? fmtV(MJ.subtract(r.val[0], r.val[1])) : HM.fmt(r.res, 4)) : 'undefined'}.`, 'bad')); }
        else if (miss.length === 1) {
          const u = miss[0];
          if (e.lhsSym === u && !Object.keys(freeVars(e.R)).includes(u)) { let r; try { r = e.Rc.evaluate({ ...known }); } catch (err) { r = NaN; } ex.push(isArr(r) || isFinite(real(r)) ? U.note(`Equation ${e.i} gives <b>${u} = ${fmtV(r)}</b> from the example values.`, 'good') : U.note(`Equation ${e.i}: ${u} could not be evaluated from example values.`, 'bad')); }
          else if (e.kinds[u] === 's') { const first = d => isArr(d) ? real(MJ.flatten(MJ.matrix(d)).valueOf()[0]) : real(d); const r0 = root(x => { try { return first(MJ.subtract(e.Lc.evaluate({ ...known, [u]: x }), e.Rc.evaluate({ ...known, [u]: x }))); } catch (err) { return NaN; } }); const chk = r0 == null ? null : residual(e, { ...known, [u]: r0 }); const r = chk && chk.res / chk.scale < 1e-6 ? r0 : null; if (r0 != null && r == null) { ex.push(U.note(`Equation ${e.i}: ${u} = ${HM.fmt(r0, 5)} satisfies first row but not others.`, 'bad')); return; } ex.push(r == null ? U.note(`Equation ${e.i}: no real ${u} satisfies it with example values.`, 'bad') : U.note(`Equation ${e.i} gives <b>${u} = ${HM.fmt(r, 5)}</b> from example values.`, 'good')); }
          else ex.push(U.note(`Equation ${e.i}: ${u} is a matrix or list; write equation with ${u} alone on left to solve for it.`));
        }
        else ex.push(U.note(`Equation ${e.i}: ${miss.length} unknowns (${miss.join(', ')}), give all but one to solve it.`));
      });

      // the status is a button: click it to switch that equation off (or back on)
      const stBtn = r => r[4] == null ? r[2] : '<button type="button" class="st" data-line="' + r[4] + '" title="' + U.esc(r[5] ? t.turnOn : t.turnOff) + '">' + r[2] + '</button>';
      let h = '<p class="hint" style="margin:0 0 4px">' + t.clickHint + '</p><table class="tt"><thead><tr><th>' + t.tblNum + '</th><th>' + t.tblParsed + '</th><th>' + t.tblStatus + '</th></tr></thead><tbody>' + rows.map(r => '<tr' + (r[5] ? ' class="off"' : '') + '><td>' + r[0] + '</td><td>' + r[1] + '<br><span style="font-size:.85rem; color:var(--ink-2)">' + r[3] + '</span></td><td>' + stBtn(r) + '</td></tr>').join('') + '</tbody></table>';
      if (badVals.length) h = U.note('Could not read these value entries (ignored): ' + badVals.map(x => U.esc(x)).join('; '), '') + h;
      if (pairs.length) h += '<h3>' + t.rearr + '</h3>' + pairs.join('');
      if (ex.length) h += '<h3>' + t.workedEx + '</h3>' + ex.join('');
      return { html: h, work: [
        'Each equation is parsed into a symbolic expression tree (math.js) and evaluated as left side − right side; for matrices, every element must agree and both sides must have the same size.',
        'Domain: 200 random values per variable (30 if the equation contains integrals or sums), 0.2 to 10, log-spaced; both signs if "Any sign". Summation limits are whole numbers; data indexed in a sum (x_i) are lists.',
        'Definite integrals: adaptive Gauss–Kronrod (7/15-point) quadrature; infinite limits are mapped to a finite interval with x = a + t/(1 − t).',
        'Infinite sums: Euler–Maclaurin summation with N = 100, cross-checked at N = 200; sums with alternating signs are accelerated with Wynn\'s ε-algorithm.',
        'Indefinite integrals: the other side is differentiated numerically and compared with the integrand at 25 random points.',
        'Rearrangement: where one equation has a variable alone on the left, its value is substituted into the other; otherwise solved numerically. 12 random tests, relative tolerance 10⁻⁶.',
        'Worked example: with all values known the residual is tested; with one unknown it is evaluated directly or solved by bracketing and bisection.'] };
    }
  });
})();
</script>

<p class="ra-foot">How to cite: Flynn, T. (2026). <i>Equation checker: plausibility checks for soil and environmental results</i> [software]. <a href="https://doi.org/10.5281/zenodo.23787685" target="_blank" rel="noopener">https://doi.org/10.5281/zenodo.23787685</a></p>

<script>
(function () {
  const msg = t => document.getElementById('ra-msg').textContent = t;
  const box = () => document.getElementById('eq-eqs');
  const setEqs = text => { const el = box(); if (!el) return; el.value = text; el.dispatchEvent(new Event('input', { bubbles: true })); };
  const eqLines = t => t.split(/\r?\n|\r/).map(s => s.replace(/[\u00A0\s]+/g, ' ').trim()).filter(s => s.length > 0 && s.length < 400 && /[^=<>!]=[^=]/.test(s));
  const withEquals = xs => { const w = xs.filter(x => /[^=<>!]=[^=]/.test(x)); return w.length ? w : xs; };
  const plural = n => `${n} equation${n === 1 ? '' : 's'}`;

  // Paste: when the clipboard comes from Word it carries the equation's OMML in its
  // HTML. Read that instead of the flattened plain text (which mixes up fractions,
  // subscripts and powers). Works in Word's panel and in a normal browser.
  document.addEventListener('paste', ev => {
    const el = ev.target;
    if (!el || el.id !== 'eq-eqs' || !ev.clipboardData) return;
    let eqs = [];
    try { eqs = window.equationsFromClipboardHtml(ev.clipboardData.getData('text/html')); } catch (e) { console.warn(e); }
    if (!eqs.length) return;                       // not from Word: normal paste
    ev.preventDefault();
    const s = el.selectionStart ?? el.value.length, t = el.selectionEnd ?? el.value.length;
    const before = el.value.slice(0, s), after = el.value.slice(t);
    const ins = (before && !before.endsWith('\n') ? '\n' : '') + eqs.join('\n') + (after && !after.startsWith('\n') ? '\n' : '');
    el.value = before + ins + after;
    el.selectionStart = el.selectionEnd = (before + ins).length;
    el.dispatchEvent(new Event('input', { bubbles: true }));
    msg(`Read ${plural(eqs.length)} from the Word equation you pasted.`);
  }, true);

  if (typeof Office === 'undefined') { msg('Running outside Word. Paste equations into the box below.'); return; }

  Office.onReady(info => {
    if (info.host !== Office.HostType.Word) { msg('Running outside Word. Paste equations into the box below.'); return; }
    document.body.className = ((window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'quarto-dark' : 'quarto-light') + ' in-word';

    // Selection: read the selection's OOXML so Word equations keep their structure.
    // quiet = called automatically on a selection change: say nothing if there is no equation.
    let lastAuto = '';
    const readSelection = quiet => Word.run(async ctx => {
      const sel = ctx.document.getSelection();
      const ox = sel.getOoxml(); await ctx.sync();
      let eqs = withEquals(window.equationsFromOoxml(ox.value, eqLines));
      if (!eqs.length) { sel.load('text'); await ctx.sync(); eqs = eqLines(sel.text || ''); }
      if (!eqs.length) { if (!quiet) msg('No equations found in the selection. Highlight one or more equations (Word equations or typed lines with "=").'); return; }
      const text = eqs.join('\n');
      if (quiet && text === lastAuto) return;      // same equations as last time: leave the box (and any lines switched off) alone
      lastAuto = text;
      setEqs(text); msg(`Read ${plural(eqs.length)} from the selection.`);
    }).catch(e => { if (!quiet) msg('Could not read the selection: ' + e.message); });
    document.getElementById('ra-sel').onclick = () => readSelection(false);

    // Check automatically when the selection changes (switch off with the tick box under the language menu)
    let timer = null;
    const autoOn = () => { try { return localStorage.getItem('ra-auto') !== '0'; } catch (e) { return true; } };
    Office.context.document.addHandlerAsync(Office.EventType.DocumentSelectionChanged, () => {
      if (!autoOn()) return;
      clearTimeout(timer); timer = setTimeout(() => readSelection(true), 350);
    });

    // Whole document: same OOXML route. Paragraphs without a Word equation only count when
    // they look like a formula, not a sentence that happens to contain "=" (e.g. "n = 30 samples were ...").
    const formulaLike = s => s.length < 120 && (s.match(/[A-Za-z]{4,}/g) || []).filter(w => !/^(sqrt|exp|log|sin|cos|tan|sinh|cosh|tanh|frac|left|right|partial|nabla|alpha|beta|gamma|delta|Delta|theta|lambda|sigma|Sigma|omega|Omega|infty|cdot|times|mathrm|text|bar|hat)$/.test(w)).length <= 2;
    document.getElementById('ra-doc').onclick = () => Word.run(async ctx => {
      const ox = ctx.document.body.getOoxml(); await ctx.sync();
      const eqs = window.equationsFromOoxml(ox.value, t => eqLines(t).filter(formulaLike)).filter(x => /[^=<>!]=[^=]/.test(x));
      if (!eqs.length) { msg('No equations found in the document.'); return; }
      setEqs(eqs.slice(0, 60).join('\n'));
      msg(`Found ${plural(eqs.length)}${eqs.length > 60 ? ' (first 60 shown)' : ''}. Remove any that aren't equations.`);
    }).catch(e => msg('Could not read the document: ' + e.message));

    document.getElementById('ra-com').onclick = () => Word.run(async ctx => {
      const res = document.querySelector('#eq .res');
      const bad = res ? [...res.querySelectorAll('.note.bad')].map(n => n.textContent.trim()) : [];
      const tags = res ? [...res.querySelectorAll('tbody tr')].filter(tr => tr.querySelector('.tag.bad, .tag.warn')).map(tr => `Eq ${tr.cells[0].textContent}: ${tr.cells[2].textContent.trim()}, ${tr.cells[1].querySelector('span') ? tr.cells[1].querySelector('span').textContent.trim() : ''}`) : [];
      const text = (tags.concat(bad).join('\n') || 'Equation check: no problems found.') + '\n(Equation checker, https://doi.org/10.5281/zenodo.23787685)';
      const r = ctx.document.getSelection();
      if (Office.context.requirements.isSetSupported('WordApi', '1.4')) { r.insertComment(text); await ctx.sync(); msg('Comment added to the selection.'); }
      else { r.insertText('\n[' + text + ']', 'After'); await ctx.sync(); msg('Findings inserted as text after the selection.'); }
    }).catch(e => msg('Could not add the comment: ' + e.message));
  });
})();
</script>
